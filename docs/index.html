<title>Neurosurgery Residency Tracker</title>

<style>
/* Layout: a theatre-board tool. Navy masthead with section tabs over one working column up to 1200px;
   cases read like the OR whiteboard, records like a logbook. Tables scroll inside their own frames. */
:root {
  --bg: #EDF1F3;
  --surface: #FFFFFF;
  --sunken: #E3E9EC;
  --ink: #0F1F2B;
  --muted: #566875;
  --faint: #7F909C;
  --line: #D3DBE0;
  --mast: #0E2130;
  --mast-ink: #EAF2F6;
  --mast-muted: #9DB2C0;
  --mast-line: #24394B;
  --accent: #0F766E;
  --accent-ink: #FFFFFF;
  --accent-soft: #E0F2EF;
  --accent-bright: #5CC3D6;
  --hold: #B3261E; --hold-soft: #FBE7E5;
  --warn: #8A5300; --warn-soft: #F8EDD5;
  --ok: #1D7445; --ok-soft: #DFF1E6;
  /* levels: juniors in blues, midseniors in teal-greens, seniors in violet */
  --l0: #E3E8ED; --l1: #D6E7FA; --l2: #B5D3F5; --l3: #8DBBEE; --l4: #2E9C88; --l5: #1B7E6B; --l6: #6A4BC4;
  --l-ink-lo: #132F4C; --l-ink-hi: #FFFFFF;
  /* tone pairs (background, ink) for section tiles, categories, statuses */
  --amber-bg: #FFF4D6; --amber-fg: #8A5A00;
  --blue-bg: #E3EFFF;  --blue-fg: #1E4F9C;
  --violet-bg: #EFE7FF; --violet-fg: #5B34A8;
  --green-bg: #DFF5E6; --green-fg: #146C3A;
  --rose-bg: #FFE5EA;  --rose-fg: #A3223F;
  --teal-bg: #DCF3F1;  --teal-fg: #0D625B;
  --orange-bg: #FFE9D9; --orange-fg: #9A4A0B;
  --slate-bg: #E8ECF0; --slate-fg: #3C4A57;
  --scrim: rgba(7, 18, 27, .5);
  --shadow: 0 1px 2px rgba(14, 33, 48, .08), 0 12px 32px rgba(14, 33, 48, .14);
  --r: 10px;
  --f-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Noto Sans Arabic", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A131A; --surface: #101C25; --sunken: #16242E; --ink: #E2ECF1; --muted: #93A7B4; --faint: #6E8290; --line: #22333F;
    --mast: #07111A; --mast-ink: #E2ECF1; --mast-muted: #8EA3B1; --mast-line: #1B2C39;
    --accent: #2BB3A5; --accent-ink: #04201D; --accent-soft: #133A36; --accent-bright: #6FD0E2;
    --hold: #FF8F84; --hold-soft: #3A1714; --warn: #F2BC55; --warn-soft: #33260C; --ok: #6ED69C; --ok-soft: #0F2F1E;
    --l0: #26313A; --l1: #1A3550; --l2: #1F4468; --l3: #285A88; --l4: #2B8C7A; --l5: #3FAF98; --l6: #9C84F0;
    --l-ink-lo: #DCEBFA; --l-ink-hi: #071A16;
    --amber-bg: #3B2F12; --amber-fg: #FFD27A; --blue-bg: #172B47; --blue-fg: #9CC3FF; --violet-bg: #2A1F45; --violet-fg: #C9B3FF;
    --green-bg: #133322; --green-fg: #8BE0A9; --rose-bg: #3D1820; --rose-fg: #FF9CB0; --teal-bg: #123533; --teal-fg: #84DED4;
    --orange-bg: #3C2414; --orange-fg: #FFB57D; --slate-bg: #26313A; --slate-fg: #C2CCD5;
    --scrim: rgba(0, 0, 0, .6);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A131A; --surface: #101C25; --sunken: #16242E; --ink: #E2ECF1; --muted: #93A7B4; --faint: #6E8290; --line: #22333F;
  --mast: #07111A; --mast-ink: #E2ECF1; --mast-muted: #8EA3B1; --mast-line: #1B2C39;
  --accent: #2BB3A5; --accent-ink: #04201D; --accent-soft: #133A36; --accent-bright: #6FD0E2;
  --hold: #FF8F84; --hold-soft: #3A1714; --warn: #F2BC55; --warn-soft: #33260C; --ok: #6ED69C; --ok-soft: #0F2F1E;
  --l0: #26313A; --l1: #1A3550; --l2: #1F4468; --l3: #285A88; --l4: #2B8C7A; --l5: #3FAF98; --l6: #9C84F0;
  --l-ink-lo: #DCEBFA; --l-ink-hi: #071A16;
  --amber-bg: #3B2F12; --amber-fg: #FFD27A; --blue-bg: #172B47; --blue-fg: #9CC3FF; --violet-bg: #2A1F45; --violet-fg: #C9B3FF;
  --green-bg: #133322; --green-fg: #8BE0A9; --rose-bg: #3D1820; --rose-fg: #FF9CB0; --teal-bg: #123533; --teal-fg: #84DED4;
  --orange-bg: #3C2414; --orange-fg: #FFB57D; --slate-bg: #26313A; --slate-fg: #C2CCD5;
  --scrim: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--mast); }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; }
h1 { font-size: 30px; line-height: 1.1; font-weight: 750; font-stretch: 110%; letter-spacing: -.015em; }
h2 { font-size: 18px; line-height: 1.25; font-weight: 700; font-stretch: 106%; }
h3 { font-size: 14.5px; line-height: 1.3; font-weight: 700; }
p { margin: 0; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.label { font-family: var(--f-display); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 650; }
.eyebrow { font-family: var(--f-display); font-size: 11.5px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 700; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* icons and tones */
.ic { width: 18px; height: 18px; flex: none; }
.btn .ic { width: 16px; height: 16px; margin-left: -2px; }
.btn.sm .ic { width: 14px; height: 14px; }
.btn.primary .ic { opacity: .95; }
.tone-amber { --tone-bg: var(--amber-bg); --tone-fg: var(--amber-fg); }
.tone-blue { --tone-bg: var(--blue-bg); --tone-fg: var(--blue-fg); }
.tone-violet { --tone-bg: var(--violet-bg); --tone-fg: var(--violet-fg); }
.tone-green { --tone-bg: var(--green-bg); --tone-fg: var(--green-fg); }
.tone-rose { --tone-bg: var(--rose-bg); --tone-fg: var(--rose-fg); }
.tone-teal { --tone-bg: var(--teal-bg); --tone-fg: var(--teal-fg); }
.tone-orange { --tone-bg: var(--orange-bg); --tone-fg: var(--orange-fg); }
.tone-slate { --tone-bg: var(--slate-bg); --tone-fg: var(--slate-fg); }
.tile { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--tone-bg); color: var(--tone-fg); flex: none; }
.tile .ic { width: 23px; height: 23px; }
.tile.sm { width: 34px; height: 34px; border-radius: 10px; }
.tile.sm .ic { width: 18px; height: 18px; }
.htitle { display: flex; align-items: center; gap: 14px; min-width: 0; }
.hrow { display: flex; align-items: center; gap: 8px; }
.hrow > .ic { color: var(--accent); }

/* masthead */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--mast); color: var(--mast-ink); }
.top-in { display: grid; gap: 4px; padding-block: 12px 0; }
.toprow { display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 11px; margin-right: auto; min-width: 0; }
.brand svg { flex: none; }
.b1 { font-family: var(--f-display); font-weight: 750; font-stretch: 115%; font-size: 15.5px; line-height: 1.1; letter-spacing: .01em; }
.b2 { font-size: 12px; color: var(--mast-muted); }
nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; }
nav::-webkit-scrollbar { display: none; }
.navbtn { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 10px 12px 10px; cursor: pointer; color: var(--mast-muted); font-family: var(--f-display); font-weight: 650; font-size: 13.5px; letter-spacing: .01em; white-space: nowrap; border-bottom: 3px solid transparent; }
.navbtn:hover { color: var(--mast-ink); }
.navbtn .ic { width: 16px; height: 16px; }
.navbtn[aria-current="page"] .ic { color: var(--accent-bright); }
.navbtn[aria-current="page"] { color: var(--mast-ink); border-bottom-color: var(--accent-bright); }
.navbtn .cnt { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 6px; border-radius: 9px; background: var(--accent-bright); color: var(--mast); font-size: 11px; font-weight: 750; }
.modechip { background: none; cursor: default; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--mast-line); color: var(--mast-muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--mast-muted); }
.modechip.live .dot { background: #4CD38A; }
button.modechip { cursor: pointer; }
button.modechip .ic { width: 14px; height: 14px; }

main { padding-block: 28px 72px; display: grid; gap: 22px; }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--r); background: var(--warn-soft); color: var(--warn); font-weight: 700; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-family: var(--f-display); font-weight: 650; font-size: 13.5px; white-space: nowrap; }
.btn:hover { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--hold); border-color: color-mix(in oklab, var(--hold) 40%, var(--line)); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 8px; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.iconbtn { width: 30px; height: 30px; display: inline-grid; place-items: center; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); cursor: pointer; font-size: 14px; line-height: 1; color: var(--muted); }
.iconbtn:hover { color: var(--ink); border-color: var(--faint); }
.iconbtn:disabled { opacity: .35; cursor: default; }

.head { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.head > div:first-child { display: grid; gap: 6px; min-width: 0; }
.head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 16px; }
.stack { display: grid; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sep { height: 1px; background: var(--line); }

/* figures strip */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 14px 16px; display: grid; gap: 4px; }
.stat .label { display: flex; align-items: center; gap: 7px; }
.stat .label .ic { width: 16px; height: 16px; color: var(--tone-fg, var(--faint)); }
.stat .v { font-family: var(--f-mono); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat .v small { font-size: 14px; color: var(--muted); font-weight: 400; }
.stat.attn .v { color: var(--warn); }

/* level pills and avatars */
.lvl { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; padding: 2px 7px; border-radius: 5px; font-family: var(--f-mono); font-size: 11px; font-weight: 600; letter-spacing: .02em; line-height: 1.5; }
.l0 { background: var(--l0); color: var(--l-ink-lo); } .l1 { background: var(--l1); color: var(--l-ink-lo); }
.l2 { background: var(--l2); color: var(--l-ink-lo); } .l3 { background: var(--l3); color: var(--l-ink-lo); }
.l4 { background: var(--l4); color: var(--l-ink-hi); } .l5 { background: var(--l5); color: var(--l-ink-hi); }
.l6 { background: var(--l6); color: var(--l-ink-hi); }
.lvlname { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.av { flex: none; width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-family: var(--f-display); font-weight: 750; font-size: 11.5px; letter-spacing: .02em; }
.av.sm { width: 24px; height: 24px; font-size: 10px; }
.av.lg { width: 52px; height: 52px; font-size: 18px; }
.person { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
.person .nm { font-weight: 700; }

/* chips */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; white-space: nowrap; background: var(--sunken); color: var(--muted); line-height: 1.6; }
.chip.hold { background: var(--hold-soft); color: var(--hold); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.line { background: none; border: 1px solid var(--line); }
.chip { display: inline-flex; align-items: center; gap: 4px; }
.chip .ic { width: 13px; height: 13px; }
.chip.tone { background: var(--tone-bg); color: var(--tone-fg); }

/* department mix */
.mix { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; }
.mixcol { display: grid; gap: 6px; text-align: center; min-width: 0; }
.mixbar { border-radius: 5px 5px 2px 2px; min-height: 6px; }
.mixn { font-family: var(--f-mono); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.mixlab { font-size: 11.5px; color: var(--muted); line-height: 1.25; overflow-wrap: anywhere; }
.mixlab .short { display: none; font-family: var(--f-mono); }
.mixgroups { display: grid; grid-template-columns: 4fr 2fr 1fr; gap: 6px; margin-top: 4px; }
.mixgroups div { border-top: 2px solid var(--line); padding-top: 4px; font-size: 11.5px; color: var(--muted); text-align: center; }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-family: var(--f-display); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 650; white-space: nowrap; background: var(--surface); }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: color-mix(in oklab, var(--accent-soft) 50%, transparent); }
tr.grouprow td { background: var(--sunken); font-family: var(--f-display); font-weight: 700; font-size: 12.5px; padding-block: 8px; }
.rname { font-weight: 700; }
.nextcell { max-width: 300px; color: var(--muted); font-size: 13px; }

.search { width: 100%; max-width: 320px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.empty { display: grid; gap: 14px; padding: 28px; }
.empty p { max-width: 62ch; }

/* resident page */
.rhead { display: grid; gap: 14px; }
.back { justify-self: start; margin-left: -8px; }
.rtitle { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.facts { display: flex; gap: 10px 32px; flex-wrap: wrap; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.fact { display: grid; gap: 2px; }
.fact .v { font-family: var(--f-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.fact .v.t { font-family: var(--f-body); font-size: 15px; font-weight: 700; padding-top: 4px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; padding: 10px 14px; cursor: pointer; font-family: var(--f-display); font-weight: 650; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; }
.tick { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-top: 2px; }
.tick.ok { background: var(--ok); color: var(--surface); }
.tick.todo { border: 2px solid var(--line); }
.tick.block { background: var(--hold); color: var(--surface); }

.progress { height: 8px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* level ladder */
.ladder { display: grid; }
.rung { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.rung:last-child { border-bottom: 0; }
.rung.future { opacity: .55; }
.rung.now .rname::after { content: "Current"; margin-left: 8px; font-family: var(--f-display); font-size: 10.5px; font-weight: 750; color: var(--accent); text-transform: uppercase; letter-spacing: .08em; }

/* requirements */
.reqrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.reqrow:last-child { border-bottom: 0; }
.reqdates { display: flex; gap: 8px; flex-wrap: wrap; }
.reqdates label { display: grid; gap: 2px; font-size: 11px; color: var(--muted); }
input[type="date"], input[type="time"], input[type="number"], input[type="text"], input[type="search"], select, textarea { border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; background: var(--surface); min-width: 0; }
input[type="number"] { width: 84px; }
textarea { width: 100%; resize: vertical; }

/* modal */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: 100%; max-width: 800px; display: grid; }
.modal.narrow { max-width: 520px; }
.mhead { padding: 20px 22px 14px; display: grid; gap: 4px; border-bottom: 1px solid var(--line); }

/* Places of one step are shared, never all to one resident. The lead takes the majority (one of two sides,
   three of four screws); the rest go to the first resident on the team from "next" who may do the step, else to the specialist.
   lead: the level that leads when it is on the team and may do the step (otherwise whoever the ladder gives the first place).
   below: levels that may take their share under their ceiling, with the specialist scrubbed. */
const PLACE_SHARE = {
  "sp.muscle": { next: ["J", "S", "M"] },        // the other side: a junior already allowed the step, else the senior
  "sp.screw": { lead: "S", next: ["M"], below: ["M"] }, // the senior places most screws, the midsenior the rest

function planList(cases, unavailable, ym) {
  const extra = {};

  const slots = [];
  cases.forEach((c, ci) => ["S", "M", "J"].forEach(g => slots.push({ ci, g, id: null, why: "" })));
  const cnt = id => casesThisMonth(id, ym) + (extra[id] || 0);
  const minOf = id => SURG_MIN[LEVELS[run(S.residents[id]).level].key] || 0;
  const place = (slot, id, why) => { slot.id = id; slot.why = why; used.add(id); extra[id] = (extra[id] || 0) + 1; };
  // round 1: minimums, furthest behind first
  slots.forEach(slot => {
    const c = pool.filter(id => !used.has(id) && groupOf(run(S.residents[id]).level) === slot.g && cnt(id) < minOf(id))
      .sort((a, b) => (minOf(b) - cnt(b)) - (minOf(a) - cnt(a)) || (cxOf(a).lastDate || "").localeCompare(cxOf(b).lastDate || ""));
    if (c.length) place(slot, c[0], `Below the monthly minimum (${cnt(c[0])} of ${minOf(c[0])} cases)`);
  });
  // round 2: reward pool by priority score; holds and repeated no-shows get no spare places
  slots.filter(s => !s.id).forEach(slot => {
    const cs = cases[slot.ci], seq = caseSeq(cs), steps = orderedSteps(cs);
    const c = pool.filter(id => { const E = run(S.residents[id]); return !used.has(id) && groupOf(E.level) === slot.g && !E.holdNow && !E.rewardExcluded && !reliability(id).offender; })
      .map(id => ({ id, pri: priority(id, seq, steps, ym, extra[id] || 0) })).sort(byPriority);
    if (c.length) place(slot, c[0].id, `Reward pool. ${priText(c[0].pri)}`);
    else slot.why = `No ${GROUP_NAME[slot.g].toLowerCase()} available`;
  });
  return cases.map((cs, ci) => {
    const members = slots.filter(s => s.ci === ci && s.id).map(s => ({ id: s.id, why: s.why, g: s.g }));
    const empty = slots.filter(s => s.ci === ci && !s.id).map(s => s.why);
    if (catOf(cs.cat).rule === "advanced" || isLP(cs)) return Object.assign(planAdvanced(cs, members), { empty });

  });
}

/* ---------- next step text ---------- */
function nextStep(res, E) {
  const L = E.level, items = [], start = startOf(res);

  const examItem = n => {
    const p = examPassed(res, n);
    if (p) return { state: "ok", text: `Exam ${n} passed${p.month ? " (" + ymLabel(p.month) + (p.score != null ? ", " + p.score + "/100" : "") + ")" : " before launch"}` };
    return { state: "todo", text: `Exam ${n} not passed. Can sit from ${ymLabel(examEligibleFrom(res, n))}.` };
  };
  const reqItem = lvls => { const [s, t] = reqCount(res, lvls); return { state: s === t ? "ok" : "todo", text: `Requirements signed off: ${s} of ${t}` }; };
  const ptsItem = thr => ({ state: E.cum >= thr ? "ok" : "todo", text: `${fmt(E.cum)} of ${thr.toLocaleString("en-US")} points`, pct: Math.min(100, E.cum / thr * 100) });
  const pace = (thr, cut) => {
    if (E.cum >= thr || !E.avg3) return "";

    return reach < cut ? `At the recent average of ${fmt(E.avg3)}, they reach ${thr.toLocaleString("en-US")} points in month ${reach} (${ymLabel(cutYM(reach))}), ahead of the cut.` : `At the recent average of ${fmt(E.avg3)}, the ${cut}-month cut comes first.`;
  };
  if (L === 0) { title = "Next: 4-day junior"; sub = "Moves up at the end of the first month in which the attached requirements are signed off."; items.push(reqItem([0])); }
  else if (L === 1) {
    title = "Next: 3-day junior";
    sub = `Automatically at the end of month ${RULE.j3Cut}, effective ${ymLabel(cutYM(RULE.j3Cut + 1))}. Earlier with 500 points and the requirements below signed off.`;
    items.push(ptsItem(RULE.j3Points), reqItem([0, 1]));
    const p = pace(RULE.j3Points, RULE.j3Cut); if (p) items.push({ state: "info", text: p });
  } else if (L === 2 || L === 3) {
    title = "Next: 2-day midsenior";
    sub = E.i > RULE.msCut && !examPassed(res, 1) ? "The 18-month cut has passed. They move up the month after passing Exam 1." : `At the end of month ${RULE.msCut} with Exam 1 passed, effective ${ymLabel(cutYM(RULE.msCut + 1))}.`;
    items.push(examItem(1));
    if (L === 2 && E.i <= RULE.msCut) {

    }
  } else if (L === 4 || L === 5) {
    title = "Next: Senior";
    sub = E.i > RULE.srCut && !examPassed(res, 2) ? "The 30-month cut has passed. They move up the month after passing Exam 2." : `At the end of month ${RULE.srCut} with Exam 2 passed, effective ${ymLabel(cutYM(RULE.srCut + 1))}.`;
    items.push(examItem(2));
    if (L === 4 && E.i <= RULE.srCut) {
      early = { title: "Early step: 1-day midsenior", items: [ptsItem(RULE.m1Points), examItem(2), reqItem([0, 1, 2, 4])] };
      const p = pace(RULE.m1Points, RULE.srCut); if (p) early.items.push({ state: "info", text: p });
    }
  } else {
    const t = seniorTier(res, E);
    title = `Senior ${["I", "II", "III"][t.n - 1]}`;
    sub = t.firstReview ? `Every senior starts at Senior I. Tiers are first reviewed after ${RULE.tierReviewMonths} months of scores (${E.scoredSince} so far).` : "Tiers follow the running 6-month average, are reviewed every 6 months, and can go down as well as up.";
    items.push({ state: t.avg6 >= RULE.srII ? "ok" : "todo", text: `6-month average: ${fmt(t.avg6)} (Senior II needs ${RULE.srII}, Senior III needs ${RULE.srIII})` });
    items.push({ state: t.hold6 ? "block" : "ok", text: t.hold6 ? "A hold in the last 6 months" : "No hold in the last 6 months" });
    items.push({ state: t.hold12 ? "todo" : "ok", text: t.hold12 ? "A hold in the last 12 months (blocks Senior III)" : "No hold in the last 12 months" });
    items.push({ state: t.emergencyDone ? "ok" : "todo", text: t.emergencyDone ? "Every basic emergency ladder completed" : "Senior III needs every basic emergency ladder completed" });
  }
  if (E.holdNow) items.unshift({ state: "block", text: `On hold through ${ymLabel(ymAdd(start, E.holdEnd - 1))}. No upgrade by points or by time, and no surgical rewards, until it ends.` });
  return { title, sub, items, early };
}

/* ---------- the installable app: records on a Google Apps Script server ---------- */
/* A link carries the server's address and one person's key: ?c=<base64url of {s, k, n}>. */
/* A device remembers every link opened on it ({active, list}), so an owner who opens a resident's link

const CONN_KEY = "residency-tracker-connection", CONNS_KEY = "residency-tracker-connections";
function readConns() {
  try {
    const o = JSON.parse(localStorage.getItem(CONNS_KEY) || "null");
    if (o && Array.isArray(o.list)) return o;
    const old = JSON.parse(localStorage.getItem(CONN_KEY) || "null");
    return old ? { active: old.k, list: [old] } : { active: null, list: [] };
  } catch (e) { return { active: null, list: [] }; }
}

function saveConn(c) {

  else { o.list = o.list.filter(x => x.k !== (S.conn ? S.conn.k : o.active)); o.active = o.list[0] ? o.list[0].k : null; }
  writeConns(o);
}
function noteMe(me) { const o = readConns(), c = o.list.find(x => x.k === S.conn.k); if (c) { c.n = me.name; c.r = me.role; writeConns(o); } }

const appBase = () => location.origin + location.pathname;

  const r = await fetch(S.conn.s, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ key: S.conn.k, fn, args }), redirect: "follow" });

/* The same calls the page makes on the claude.ai database (collection/doc, onSnapshot, set/update/delete),

function remoteDB() {
  const docs = {}, subs = [];

  const inCol = (path, name) => path.split("/")[0] === name;
  const snapCol = name => ({ docs: Object.keys(docs).filter(p => inCol(p, name)).map(p => ({ id: p.split("/")[1], data: () => clone(docs[p]) })) });
  const snapDoc = path => ({ exists: path in docs, data: () => clone(docs[path]) });
  const fire = s => s.cb(s.col ? snapCol(s.path) : snapDoc(s.path));
  const emit = changed => subs.forEach(s => { if (changed.some(p => s.col ? inCol(p, s.path) : p === s.path)) fire(s); });
  const apply = list => list.map(d => { if (d.data == null) delete docs[d.path]; else docs[d.path] = d.data; return d.path; });
  const load = b => { Object.keys(docs).forEach(k => delete docs[k]); apply(b.docs); rev = b.rev; subs.forEach(fire); };

    if (busy) return;

      const r = await call("sync", rev);
      if (r.reset) load(await call("bootstrap"));
      else { rev = r.rev; const ch = apply(r.changes); if (ch.length) emit(ch); }
      if (S.syncErr) { S.syncErr = null; render(); }
    } catch (e) {

    start: async () => { const b = await call("bootstrap"); S.me = b.me; load(b); schedule(); },
    reload: async () => load(await call("bootstrap")),
    collection: name => ({
      onSnapshot: cb => { const s = { col: true, path: name, cb }; subs.push(s); fire(s); },
      doc: () => ({ id: name.slice(0, 1) + uid() + uid() }),
    }),
    doc: path => ({
      onSnapshot: cb => { const s = { col: false, path, cb }; subs.push(s); fire(s); },
      set: data => write("setDoc", path, data),
      update: data => write("updateDoc", path, data),
      delete: () => write("deleteDoc", path, null),
    }),
  };
}

/* ---------- fairness ---------- */
function fairView() {
  const ids = sortedIds().filter(id => run(S.residents[id]).level >= 1), ym = ymNow();
  const group = g => ids.filter(id => groupOf(run(S.residents[id]).level) === g);
  const table = g => {
    const list = group(g);
    if (!list.length) return "";
    return `<tr class="grouprow"><td colspan="9">${GROUP_PLURAL[g]}</td></tr>` + list.map(id => {
      const r = reliability(id), mo = cxOf(id).months[ym] || { assigned: 0 }, min = SURG_MIN[LEVELS[lvlOf(id)].key] || 0;
      return `<tr class="click" data-act="open-theatre" data-id="${id}" tabindex="0"><td>${person(id)}</td><td class="r num">${mo.assigned}<span class="muted"> / ${min}</span></td><td class="r num">${pct(r.rate)}</td><td class="r num">${r.late}</td><td class="r num">${r.unx ? `<strong style="color:var(--hold)">${r.unx}</strong>` : 0}</td><td class="r num">${r.exc}</td><td class="r num">${r.covers}</td><td class="r num">${r.steps ? `${r.sat}/${r.steps}` : "–"}</td><td>${relChip(id)}</td></tr>`;
    }).join("");
  };
  // how often each specialist hands the assigned steps to the resident
  const spec = {};
  allCases().filter(c => caseStatus(c) === "done").forEach(c => {
    const s = (c.specialist || "").trim() || "Not recorded", o = spec[s] || (spec[s] = { asg: 0, given: 0, why: {} });
    (c.team || []).forEach(m => { if (!present(attOf(m))) return; (m.steps || []).forEach(k => { const r = (c.out || {})[k]; if (!r || !r.who) return; o.asg++; if (r.who === m.rid) o.given++; else if (r.reason) o.why[r.reason] = (o.why[r.reason] || 0) + 1; }); });
  });
  const specRows = Object.entries(spec).filter(([, o]) => o.asg).sort((a, b) => b[1].asg - a[1].asg);
  return `<div class="head"><div>${htitle("fair")}<p class="muted">Who comes, who covers, and who gets the steps. Cases this month are against each level's monthly minimum.</p></div></div>
  <div class="grid2">
    <div class="card stack"><h3 class="hrow">${ic("scale")}How places are shared</h3><ul class="small" style="margin:0;padding-left:18px;display:grid;gap:4px">
      <li>Two residents of the same level on one case: the one with fewer turns on their current step goes first.</li>
      <li>That tie goes the other way when the resident behind has ${RULE.offenceLimit} or more unexcused absences in ${RULE.offenceDays} days.</li>
      <li>Postponed cases and steps a specialist kept use nobody's turn. A no-show, or "not ready", uses it.</li></ul></div>
    <div class="card stack"><h3 class="hrow">${ic("award")}Rewards and penalties, applied automatically</h3><ul class="small" style="margin:0;padding-left:18px;display:grid;gap:4px">
      <li>Unexcused absence: a minor behavior event (−${RULE.minor}); three in a month count as a major.</li>
      <li>Covering for an absent colleague: the cover bonus (+${BONUS.cover.pts}, within the ${RULE.bonusCap}-point cap).</li>
      <li>Reliable (${RULE.reliableMin}+ cases, ${pct(RULE.reliableRate)} attendance, no no-shows): +${RULE.wReliable} priority for spare places. Repeated no-shows get no spare places.</li></ul></div>
  </div>
  ${ids.length ? `<div class="tablewrap"><table><thead><tr><th>Resident</th><th class="r">This month</th><th class="r">Attendance</th><th class="r">Late</th><th class="r">No-shows</th><th class="r">Excused</th><th class="r">Covers</th><th class="r">Steps sat.</th><th>Standing</th></tr></thead>
    <tbody>${["S", "M", "J"].map(table).join("")}</tbody></table></div>` : `<div class="card"><p class="muted">Add residents first.</p></div>`}
  ${S.canEdit && specRows.length ? `<div class="stack"><h2>Steps handed over, by specialist</h2><p class="small muted">Shown to editors only. Counts steps assigned to a resident who was in theatre.</p>
    <div class="tablewrap"><table><thead><tr><th>Specialist</th><th class="r">Assigned</th><th class="r">Given</th><th>Main reason when kept</th></tr></thead><tbody>
    ${specRows.map(([s, o]) => { const top = Object.entries(o.why).sort((a, b) => b[1] - a[1])[0]; return `<tr><td class="rname">${esc(s)}</td><td class="r num">${o.asg}</td><td class="r num">${o.given} <span class="muted">(${pct(o.given / o.asg)})</span></td><td class="small">${top ? esc(NOT_GIVEN[top[0]] || top[0]) + ` (${top[1]})` : "–"}</td></tr>`; }).join("")}</tbody></table></div></div>` : ""}`;
}

/* ---------- surgical starting levels ---------- */
/* One column per ladder. A column lists only the steps not already in an earlier column, so shared steps are set once. */
const BCOLS = (() => { const seen = new Set(); return LADDERS.map(p => { const own = PROCS[p].steps.filter(k => !seen.has(k)); PROCS[p].steps.forEach(k => seen.add(k)); return { p, own }; }); })();
const LP_OPTS = [0, 1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 30];
function baseValue(res, col) {
  const st = surg(res), seq = PROCS[col.p].steps;
  let v = -1;
  for (let i = 0; i < col.own.length; i++) { const upto = seq.indexOf(col.own[i]); if (seq.slice(0, upto + 1).every(st.complete)) v = i; else break; }
  return v;
}
function basePatch(res, col, v) {
  const st = surg(res), seq = PROCS[col.p].steps, base = res.stepBase || {}, patch = {};
  if (v >= 0) seq.slice(0, seq.indexOf(col.own[v]) + 1).forEach(k => { if (!st.complete(k)) patch[k] = { prov: true, n: stepDef(k).n, date: todayISO() }; });
  col.own.slice(v + 1).forEach(k => { if (base[k] && !base[k].by) patch[k] = null; });
  return patch;
}
function baselineView() {
  const ids = sortedIds().filter(id => run(S.residents[id]).level >= 1), dis = S.canEdit ? "" : "disabled";
  const opts = (col, v, st) => `<option value="-1" ${v === -1 ? "selected" : ""}>Not yet</option>` + col.own.map((k, i) => `<option value="${i}" ${v === i ? "selected" : ""}>Up to ${esc(stepLabel(k))}${st && !st.inCeil(k) ? " (above ceiling)" : ""}</option>`).join("");
  const cell = (id, col) => {
    const res = S.residents[id], st = surg(res), v = baseValue(res, col), base = res.stepBase || {};
    const mine = col.own.slice(0, v + 1);
    const prov = mine.some(k => st.provisional(k)), over = mine.some(k => !st.inCeil(k));
    return `<td><select id="bl-${id}-${col.p}" data-base="${id}" data-col="${col.p}" aria-label="${esc(nm(id))}, ${esc(PROCS[col.p].short)}" ${dis}>${opts(col, v, st)}</select>
      ${prov || over ? `<div class="cellnote">${prov ? `<span class="chip accent">Provisional</span>` : ""}${over ? `<span class="chip warn">Above ceiling</span>` : ""}</div>` : ""}</td>`;
  };
  const lpCell = id => { const n = +S.residents[id].lpBase || 0, list = LP_OPTS.includes(n) ? LP_OPTS : LP_OPTS.concat([n]).sort((a, b) => a - b);
    return `<td><select id="bl-${id}-lp" data-baselp="${id}" aria-label="${esc(nm(id))}, lumbar punctures" ${dis}>${list.map(x => `<option value="${x}" ${x === n ? "selected" : ""}>${x}${x === 30 ? "+" : ""}</option>`).join("")}</select></td>`; };
  const groupRow = g => `<tr class="grouprow"><td>${GROUP_PLURAL[g]}${S.canEdit ? `<div class="small muted" style="font-weight:400">Set the whole group</div>` : ""}</td>${S.canEdit ? BCOLS.map(col => `<td><select id="bg-${g}-${col.p}" data-bgroup="${g}" data-col="${col.p}" aria-label="All ${GROUP_PLURAL[g].toLowerCase()}, ${esc(PROCS[col.p].short)}"><option value="">Set all…</option>${opts(col, -2)}</select></td>`).join("") + `<td><select id="bg-${g}-lp" data-bgrouplp="${g}" aria-label="All ${GROUP_PLURAL[g].toLowerCase()}, lumbar punctures"><option value="">Set all…</option>${LP_OPTS.map(x => `<option value="${x}">${x}</option>`).join("")}</select></td>` : `<td colspan="${BCOLS.length + 1}"></td>`}</tr>`;
  return `<div class="head"><div><button class="btn ghost back" data-act="nav" data-v="roster">${ic("chevL")}All residents</button>${htitle("baseline")}
    <p class="muted" style="max-width:76ch">Pick how far each resident has got on each ladder today. Choosing a step marks every step before it on that ladder as done. Use the group row to set a whole level at once, then change only the residents who differ.</p></div></div>
  <div class="grid2"><div class="note">Starting levels are <strong>provisional</strong> until the resident performs the step satisfactorily once, or you confirm it on their surgical ladders. They count for planning straight away.</div>
    <div class="note">A step <strong>above the level's ceiling</strong> is recorded but not assigned yet. The ceiling lifts once the starting count plus new satisfactory performances reach ${RULE.liftFactor}× the step's normal count.</div></div>
  ${ids.length ? `<div class="tablewrap bgrid"><table><thead><tr><th>Resident</th>${BCOLS.map(c => `<th>${esc(PROCS[c.p].short)}</th>`).join("")}<th>LP done</th></tr></thead><tbody>
    ${["S", "M", "J"].map(g => { const list = ids.filter(id => groupOf(lvlOf(id)) === g); return list.length ? groupRow(g) + list.map(id => `<tr><td>${person(id, pill(lvlOf(id)))}</td>${BCOLS.map(col => cell(id, col)).join("")}${lpCell(id)}</tr>`).join("") : ""; }).join("")}
  </tbody></table></div>` : `<div class="card"><p class="muted">Add residents first.</p></div>`}`;
}

/* ---------- modals ---------- */

function parseLevel(s) {
  const k = String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const map = { attached: 0, att: 0, "4dayjunior": 1, "4day": 1, j4: 1, "3dayjunior": 2, "3day": 2, j3: 2, "2dayjunior": 3, j2: 3, "2daymidsenior": 4, ms2: 4, m2: 4, midsenior: 4, "1daymidsenior": 5, ms1: 5, m1: 5, senior: 6, sr: 6 };
  return k in map ? map[k] : null;
}
function parseYM(s) {
  s = String(s || "").trim(); let m;
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})$/))) return m[1] + "-" + m[2].padStart(2, "0");
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{4})$/))) return m[2] + "-" + m[1].padStart(2, "0");
  if ((m = s.match(/^([a-z]{3})[a-z]*\.?\s+(\d{4})$/i))) { const k = MONTHS.findIndex(x => x.toLowerCase() === m[1].toLowerCase()); if (k >= 0) return m[2] + "-" + String(k + 1).padStart(2, "0"); }
  return null;
}
function parseImport(text) {
  return String(text || "").split(/\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const p = line.split(/\t|,|;/).map(x => x.trim());
    const out = { name: p[0], start: parseYM(p[1]), level: p[2] ? parseLevel(p[2]) : null, err: "" };
    if (!out.name) out.err = "Missing name";
    else if (!out.start) out.err = "Start month not recognised";
    else if (p[2] && out.level == null) out.err = "Level not recognised";
    else if (out.level == null && out.start < ymNow()) out.err = "Add their current level";
    return out;
  });
}

/* ---------- case editor: name, category, ladder and steps, remembered in the library ---------- */
function newCase(cat) { return { title: "", cat, ladder: "", steps: [], specialist: "", libId: null, mode: 0 }; }

function openReview(c) {
  const d = clone(c);
  d.status = caseStatus(c) === "planned" ? "done" : caseStatus(c);
  d.out = d.out || {};
  d.team = d.team || [];
  d.team.forEach(t => { t.att = attOf(t); });
  d.xids = (d.extra || []).map(x => x.rid);
  d.xfor = Object.fromEntries((d.extra || []).map(x => [x.rid, x.for || ""]));
  d.allSteps = (d.steps && d.steps.length ? orderedSteps(d) : uniq(d.team.flatMap(t => t.steps || []).concat(d.specialistSteps || [])));
  d.allSteps.forEach(k => { if (!d.out[k]) { const a = assigneeOf(d, k); d.out[k] = { who: a === "spec" ? "spec" : a && present((d.team.find(t => t.rid === a) || {}).att) ? a : "" }; } });
  openModal({ type: "review", id: c.id, draft: d });
}

function parseRota(text, ym) {

      else if ((m = cell.match(/(?<!\d)(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z؀-ۿ]+)/)) && MONTH_WORDS[normAr(m[2])]) found = mk(Y, MONTH_WORDS[normAr(m[2])], +m[1]);

      else if (i === 0 && (m = cell.match(/^(?:[A-Za-z؀-ۿ]+\s+)?(\d{1,2})(?!\d)/))) found = mk(Y, M, +m[1]);

    }

      if (await patchResident(S.rid, { exams: { ["e" + m.n]: attempts(S.residents[S.rid], m.n).concat([{ month: d.month, score: sc }]) } }, sc >= RULE.passMark ? `Exam ${m.n} passed` : "Attempt recorded")) closeModal();
      break;
    }
    case "exam-del": {
      const n = +el.dataset.n, list = attempts(S.residents[S.rid], n).slice();
      const k = list.findIndex(a => a.month === el.dataset.ym && String(a.score) === el.dataset.score);
      if (k >= 0) { list.splice(k, 1); patchResident(S.rid, { exams: { ["e" + n]: list } }, "Attempt removed"); }
      break;
    }
    case "tsign": openModal({ type: "tsign", rid: S.rid, k: el.dataset.k, draft: { a: "", b: "", date: todayISO() } }); break;
    case "ts-save": {
      const d = m.draft;
      if (!d.a.trim() || !d.b.trim()) { m.err = "Enter both specialists."; renderModal(); break; }
      if (normName(d.a) === normName(d.b)) { m.err = "The two performances must be observed by different specialists."; renderModal(); break; }
      if (await patchResident(m.rid, { stepBase: { [m.k]: { by: [d.a.trim(), d.b.trim()], date: d.date } } }, "Step completed")) closeModal();
      break;
    }
    case "tsign-del": patchResident(S.rid, { stepBase: { [el.dataset.k]: null } }, "Sign-off removed"); break;
    case "base-ok": patchResident(S.rid, { stepBase: { [el.dataset.k]: Object.assign({}, S.residents[S.rid].stepBase[el.dataset.k], { ok: true }) } }, "Starting level confirmed"); break;
    case "lp-base": openModal({ type: "lpbase", draft: { n: +S.residents[S.rid].lpBase || 0 } }); break;
    case "lpb-save": if (await patchResident(S.rid, { lpBase: Math.max(0, +m.draft.n || 0) }, "Saved")) closeModal(); break;
    case "set-specs": { const list = document.getElementById("set-specs").value.split("\n").map(s => s.trim()).filter(Boolean); if (await saveSettings({ specialists: list })) toast("Specialists saved"); break; }
    case "cat-add": {
      const name = document.getElementById("cat-name").value.trim(), rule = document.getElementById("cat-rule").value;
      if (!name) { toast("Enter the category's name."); break; }
      if (cats().some(c => normName(c.name) === normName(name))) { toast("That category already exists."); break; }
      if (await saveSettings({ categories: (S.settings.categories || []).concat([{ id: "k-" + uid(), name, rule }]) })) toast(name + " added");
      break;
    }
    case "cat-del": {
      const id = el.dataset.id, inUse = libAll().some(x => x.cat === id) || allCases().some(c => c.cat === id);
      if (inUse) { toast("Cases use this category. Move them to another category first."); break; }
      if (await saveSettings({ categories: (S.settings.categories || []).filter(c => c.id !== id) })) toast("Category removed");
      break;
    }
    case "alias-del": { const a = Object.assign({}, S.settings.aliases); delete a[el.dataset.k]; if (await saveSettings({ aliases: a })) toast("Link removed"); break; }

    /* theatre: planning */
    case "new-em": { const date = todayISO(), d = { case: newCase("em"), date, time: "", specialist: "", fileNo: "", rids: [], touched: false }; d.rids = emRota(d).ids; openModal({ type: "em", draft: d }); break; }
    case "em-save": {
      const d = m.draft, c = d.case;
      if (!d.date) { m.err = "Choose the date."; renderModal(); break; }
      if (!(c.title || "").trim()) { m.err = "Name the case."; renderModal(); break; }
      const plan = planEmergency(c, d.rids, d.date.slice(0, 7)), id = "c" + uid();
      const lib = await rememberCase(c);
      const base = { date: d.date, time: d.time || "", kind: "emergency", title: c.title.trim(), lib, cat: c.cat, ladder: c.ladder || "", steps: orderedSteps(c), specialist: (d.specialist || "").trim(), fileNo: (d.fileNo || "").trim() };
      if (await saveCases({ [id]: caseFromPlan(base, plan) })) { closeModal(); S.view = "theatre"; S.ttab = "cases"; S.theatreYM = d.date.slice(0, 7); render(); toast("Case saved. Review it after the operation."); }
      break;
    }
    case "new-list": { const date = addDays(todayISO(), 1); openModal({ type: "list", draft: { list: weekday(date) === "Wed" ? "Wednesday list" : weekday(date) === "Sat" ? "Saturday list" : "Sunday list", date, cases: [newCase("el")], away: rotaDay(addDays(date, -1)).filter(id => S.residents[id]) } }); break; }
    case "ls-add": m.draft.cases.push(newCase("el")); renderModal(); break;
    case "ls-del": m.draft.cases.splice(+el.dataset.k, 1); renderModal(); break;
    case "ls-save": {
      const d = m.draft;
      if (!d.date) { m.err = "Choose the date."; renderModal(); break; }
      if (d.cases.some(c => !(c.title || "").trim())) { m.err = "Name every case, or remove the empty one."; renderModal(); break; }
      const plans = planList(d.cases, d.away, d.date.slice(0, 7)), map = {};
      for (let k = 0; k < d.cases.length; k++) {
        const c = d.cases[k], lib = await rememberCase(c);
        map["c" + uid()] = caseFromPlan({ date: d.date, kind: "elective", list: d.list, title: c.title.trim(), lib, cat: c.cat, ladder: c.ladder || "", steps: orderedSteps(c), specialist: (c.specialist || "").trim(), fileNo: (c.fileNo || "").trim() }, plans[k]);
      }
      if (await saveCases(map)) { closeModal(); S.view = "theatre"; S.ttab = "cases"; S.theatreYM = d.date.slice(0, 7); render(); toast(`${d.cases.length} case${d.cases.length === 1 ? "" : "s"} saved`); }
      break;
    }
    /* theatre: case editor */
    case "ce-edit": { const c = ceTarget(m, el.dataset.i); c.editing = true; renderModal(); break; }
    case "ce-rm": { const c = ceTarget(m, el.dataset.i); c.steps = c.steps.filter(k => k !== el.dataset.k); renderModal(); break; }
    case "ce-mv": { const c = ceTarget(m, el.dataset.i), st = orderedSteps(c), i = st.indexOf(el.dataset.k), j = i + +el.dataset.d; if (i >= 0 && j >= 0 && j < st.length) { [st[i], st[j]] = [st[j], st[i]]; c.steps = st; } renderModal(); break; }
    case "ce-newx": { const c = ceTarget(m, el.dataset.i); c.newStep = null; renderModal(); break; }
    case "ce-newok": {
      const c = ceTarget(m, el.dataset.i), ns = c.newStep, label = (ns.label || "").trim();
      if (!label) { toast("Name the new step."); break; }
      const key = "x." + uid();
      if (await saveSettings({ customSteps: Object.assign({}, S.settings.customSteps, { [key]: { label, n: +ns.n || 5, min: ns.min || "S" } }) })) { c.steps = c.steps.concat([key]); c.newStep = null; renderModal(); }
      break;
    }
    /* theatre: case library */
    case "lib-new": openModal({ type: "libedit", draft: Object.assign(newCase("el"), { editing: true, aliasText: "" }) }); break;
    case "lib-edit": { const e2 = libById(el.dataset.id); if (e2) openModal({ type: "libedit", draft: { title: e2.name, cat: e2.cat, ladder: e2.ladder, steps: e2.steps.slice(), libId: e2.id, editing: true, aliasText: e2.aliases.join(", ") } }); break; }
    case "lib-save": {
      const d = m.draft, name = (d.title || "").trim();
      if (!name) { m.err = "Name the case."; renderModal(); break; }
      const clash = libFind(name);
      if (clash && clash.id !== d.libId) { m.err = `"${clash.name}" is already in the library.`; renderModal(); break; }
      const entry = { name, aliases: (d.aliasText || "").split(/[,،]/).map(s => s.trim()).filter(Boolean), cat: d.cat, ladder: d.ladder || "", steps: orderedSteps(d), updatedAt: new Date().toISOString() };
      if (await saveLib(d.libId || "l-" + uid(), entry)) { closeModal(); toast("Saved to the case library"); }
      break;
    }
    case "lib-del": case "lib-reset": if (await saveLib(m.draft.libId, null)) { closeModal(); toast(act === "lib-del" ? "Removed from the library" : "Reset to the default"); } break;
    /* theatre: review */
    case "case-open": { const c = allCases().find(x => x.id === el.dataset.id); if (c) { if (S.canEdit) openReview(c); else openModal({ type: "caseview", id: c.id }); } break; }
    case "rv-status": m.draft.status = el.dataset.v; m.err = ""; renderModal(); break;
    case "rv-att": {
      const d = m.draft, t = d.team[+el.dataset.i]; t.att = el.dataset.v;
      d.allSteps.forEach(k => { const o = d.out[k]; if (!present(t.att) && o.who === t.rid) d.out[k] = { who: "" }; if (present(t.att) && !o.who && assigneeOf(d, k) === t.rid) d.out[k] = { who: t.rid }; });
      if (present(t.att)) Object.keys(d.xfor).forEach(x => { if (d.xfor[x] === t.rid) d.xfor[x] = ""; });
      renderModal(); break;
    }
    case "rv-o": { const o = m.draft.out[el.dataset.k]; o.o = o.o === el.dataset.v ? null : el.dataset.v; renderModal(); break; }
    case "rv-lp": m.draft.lp = Object.assign({}, m.draft.lp, { result: el.dataset.v }); renderModal(); break;
    case "rv-save": saveReview(); break;
    case "rv-del": if (await saveCases({ [m.id]: null })) { closeModal(); toast("Case deleted"); } break;
    case "rv-copy": copyText(caseText(m.draft)); break;
    case "copy-day": copyText(dayText(el.dataset.v)); break;
    /* rota */
    case "rota-paste": openModal({ type: "rota", draft: { ym: S.rotaYM, text: "", map: {} } }); break;
    case "rp-save": saveRotaPaste(); break;
    case "rota-day": openModal({ type: "rday", draft: { date: el.dataset.v, rids: rotaDay(el.dataset.v).slice() } }); break;
    case "rd-save": if (await saveRota(m.draft.date.slice(0, 7), { [m.draft.date]: m.draft.rids })) { closeModal(); toast("Day saved"); } break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.modal) { closeModal(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-act], .casecard, .rday[data-act]")) { e.preventDefault(); e.target.click(); }
});
async function setBase(ids, colKey, v) {
  const col = BCOLS.find(c => c.p === colKey);
  const jobs = ids.map(id => { const p = basePatch(S.residents[id], col, v); return Object.keys(p).length ? patchResident(id, { stepBase: p }) : null; }).filter(Boolean);
  const ok = (await Promise.all(jobs)).every(Boolean);
  if (ok) toast(jobs.length ? `Saved for ${ids.length === 1 ? nm(ids[0]) : ids.length + " residents"}` : "Nothing to change");
}
function onField(e) {
  const t = e.target;
  if (t.id === "q") { S.q = t.value; render(); return; }
  if (t.dataset.req && e.type === "change") { patchResident(S.rid, { reqs: { [t.dataset.req]: { [t.dataset.slot]: t.value || null } } }); return; }
  if (e.type === "change" && t.dataset.base) { setBase([t.dataset.base], t.dataset.col, +t.value); return; }
  if (e.type === "change" && t.dataset.bgroup && t.value !== "") { setBase(sortedIds().filter(id => run(S.residents[id]).level >= 1 && groupOf(lvlOf(id)) === t.dataset.bgroup), t.dataset.col, +t.value); return; }
  if (e.type === "change" && t.dataset.baselp) { patchResident(t.dataset.baselp, { lpBase: +t.value }, "Saved"); return; }
  if (e.type === "change" && t.dataset.bgrouplp && t.value !== "") { const ids = sortedIds().filter(id => run(S.residents[id]).level >= 1 && groupOf(lvlOf(id)) === t.dataset.bgrouplp); Promise.all(ids.map(id => patchResident(id, { lpBase: +t.value }))).then(() => toast(`Saved for ${ids.length} residents`)); return; }
  if (e.type === "change" && t.dataset.set) { saveSettings({ [t.dataset.set]: t.type === "checkbox" ? t.checked : +t.value }).then(ok => ok && toast("Saved")); return; }
  const m = S.modal; if (!m) return;
  const d = m.draft;
  let rerender = false;
  if (t.dataset.mm) { const w = t.closest(".msel"); d[t.dataset.mm] = w.querySelector('[data-part="y"]').value + "-" + w.querySelector('[data-part="m"]').value; rerender = m.type === "add" || m.type === "edit" || m.type === "rota"; }
  else if (t.dataset.ce != null) {
    const c = ceTarget(m, t.dataset.ce), f = t.dataset.f;
    if (f === "title") {
      const before = caseMode(c);
      c.title = t.value;
      if (m.type !== "libedit") { const hit = libFind(t.value); if (hit && hit.id !== c.libId) applyLib(c, hit); else if (!hit && c.libId && !c.editing) { c.libId = null; c.editing = true; } }
      rerender = caseMode(c) !== before;
    } else if (f === "cat" && e.type === "change") { c.cat = t.value; rerender = true; }
    else if (f === "ladder" && e.type === "change") { c.ladder = t.value; c.steps = t.value && PROCS[t.value] ? PROCS[t.value].steps.slice() : c.steps; rerender = true; }
    else if (f === "add" && e.type === "change") { if (t.value === "new") c.newStep = { label: "", n: 5, min: "S" }; else if (t.value && !c.steps.includes(t.value)) c.steps = c.steps.concat([t.value]); rerender = true; }
    else if (f === "nl") c.newStep.label = t.value;
    else if (f === "nn") c.newStep.n = +t.value;
    else if (f === "nm") c.newStep.min = t.value;
  }
  else if (t.dataset.m) {
    d[t.dataset.m] = t.type === "checkbox" ? t.checked : t.value;
    if (t.dataset.m === "level" && m.type === "add") { d.exam1 = +t.value >= 4; d.exam2 = +t.value >= 6; d.points = Math.max(0, ymDiff(d.bmonth, d.start)) * RULE.openingPoints; }
    if (t.dataset.rerender != null && e.type === "change") rerender = true;
    if (m.type === "em" && (t.dataset.m === "date" || t.dataset.m === "time") && e.type === "change") { if (!d.touched) d.rids = emRota(d).ids; rerender = true; }
    if (m.type === "impall" && t.dataset.m === "text") rerender = true;
    if (m.type === "list" && t.dataset.m === "date" && e.type === "change") d.away = uniq(d.away.concat(rotaDay(addDays(d.date, -1)).filter(id => S.residents[id])));
    if (t.dataset.preview != null) {
      const rows = parseImport(d.text), good = rows.filter(r => !r.err);
      document.getElementById("imp-preview").innerHTML = importPreview(rows);
      const b = document.getElementById("imp-save"); b.disabled = !good.length; b.textContent = `Add ${good.length || ""} resident${good.length === 1 ? "" : "s"}`;
    }
    if (t.dataset.rpreview != null) { d.rawNames = rawNamesOf(d.text); document.getElementById("rp-preview").innerHTML = rotaPreview(); }
  } else if (t.dataset.sc) {
    const f = t.dataset.sc;
    if (f === "holdMonths" || f === "demote") d.committee = Object.assign({}, d.committee, { [f]: t.type === "checkbox" ? t.checked : t.value });
    else d[f] = t.type === "checkbox" ? t.checked : t.value;
    if (t.dataset.rerender != null) rerender = true;
  } else if (t.dataset.ev != null) { d.events[+t.dataset.ev][t.dataset.f] = t.value; if (t.dataset.f === "tier" && e.type === "change") rerender = true; }
  else if (t.dataset.bn != null) d.bonuses[+t.dataset.bn][t.dataset.f] = t.value;
  else if (t.dataset.pick) {
    if (e.type !== "change") return;
    const set = new Set(d[t.dataset.pick]); t.checked ? set.add(t.value) : set.delete(t.value); d[t.dataset.pick] = [...set];
    if (m.type === "em" && t.dataset.pick === "rids") d.touched = true;
    if (t.dataset.pick === "xids") { Object.keys(d.xfor).forEach(x => { if (!set.has(x)) delete d.xfor[x]; }); d.allSteps.forEach(k => { if (d.out[k].who && d.out[k].who !== "spec" && !doersOf(d).includes(d.out[k].who)) d.out[k] = { who: "" }; }); }
    rerender = true;
  }
  else if (t.dataset.lc != null) d.cases[+t.dataset.lc][t.dataset.f] = t.value;
  else if (t.dataset.rexc != null) d.team[+t.dataset.rexc].reason = t.value;
  else if (t.dataset.rfor) d.xfor[t.dataset.rfor] = t.value;
  else if (t.dataset.rwho) { if (e.type !== "change") return; const o = d.out[t.dataset.rwho] = d.out[t.dataset.rwho] || {}; o.who = t.value; if (!t.value || t.value === "spec") o.o = null; o.reason = null; rerender = true; }
  else if (t.dataset.rwhy) d.out[t.dataset.rwhy].reason = t.value || null;
  else if (t.dataset.rmap) { if (e.type !== "change") return; if (t.value) d.map[t.dataset.rmap] = t.value; else delete d.map[t.dataset.rmap]; m.err = ""; rerender = true; }
  if (rerender) { renderModal(); return; }
  if (m.type === "score") { const box = document.getElementById("sc-summary"); if (box) box.innerHTML = scoreSummary(); }
}
document.addEventListener("input", onField);
document.addEventListener("change", e => { const t = e.target; if (t.type === "radio" || t.tagName === "SELECT" || t.type === "checkbox" || t.type === "date" || t.type === "time" || t.dataset.req) onField(e); });

/* ---------- start ---------- */
if (APP_BUILD) {
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); S.installEvt = e; render(); });
}
render();
(async () => {
  let db = null;
  if (APP_BUILD) {
    const fromUrl = connFromText(location.search || location.hash);
    if (fromUrl) { saveConn(fromUrl); try { history.replaceState(null, "", appBase()); } catch (e) {} }
    S.conn = fromUrl || readConn();
    if (!S.conn) { S.mode = "connect"; render(); return; }
    S.app = true;
    db = remoteDB();
    try { await db.start(); }
    catch (e) {
      const denied = String(e.code || e.message) === "ACCESS_DENIED";
      if (denied) { saveConn(null); if (readConn()) { location.replace(appBase()); return; } }
      S.mode = "connect"; S.retry = !denied;
      S.connErr = denied ? "This link has been switched off. Ask the program director for a new one." : "Could not reach the tracker's server. Check your connection and try again.";
      render(); return;
    }
    S.canEdit = S.me.role !== "resident";
    noteMe(S.me);
    if (fromUrl) toast("Connected as " + S.me.name);
  } else {
    db = window.claude && window.claude.use ? await window.claude.use("db").catch(() => null) : null;
    if (!db) { S.mode = "offline"; render(); return; }
    try { const u = await window.claude.use("user"); if (u) S.canEdit = await u.canEdit(); } catch (e) {}
  }
  S.db = db;
  const refresh = () => { invalidate(); render(); if (S.modal && S.modal.type !== "copy") renderModal(); };
  const live = () => { if (S.loaded.residents && S.loaded.cases) S.mode = "live"; invalidate(); if (S.view === "resident" && !S.residents[S.rid]) S.view = "roster"; render(); if (S.modal && S.modal.type === "delete" && !S.residents[S.modal.rid]) closeModal(); };
  const fail = () => { S.mode = "offline"; render(); toast("Lost the connection to the shared tracker. Reload to reconnect."); };
  db.collection("residents").onSnapshot(snap => { S.residents = Object.fromEntries(snap.docs.map(d => [d.id, Object.assign({}, d.data(), { _id: d.id })])); S.loaded.residents = true; live(); }, fail);
  db.collection("cases").onSnapshot(snap => { S.caseDocs = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); S.loaded.cases = true; live(); }, fail);
  db.collection("rota").onSnapshot(snap => { S.rota = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); refresh(); }, () => {});
  db.collection("library").onSnapshot(snap => { S.library = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); refresh(); }, () => {});
  db.doc("settings/program").onSnapshot(snap => { if (snap.exists) S.settings = Object.assign(clone(SETTINGS_DEFAULT), snap.data()); refresh(); }, () => {});
})();
