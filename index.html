<style>
/* Layout: a ward-office tool. Sticky top bar, one working column up to 1180px; tables scroll inside their own frames. */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --sunken: #E8EEEC;
  --ink: #13201C;
  --muted: #55655F;
  --line: #D5DFDB;
  --accent: #0D6A58;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFE9;
  --hold: #B42318;
  --hold-soft: #FCE8E6;
  --warn: #8F5400;
  --warn-soft: #FAEFD8;
  --ok: #1B7742;
  --ok-soft: #E1F2E7;
  --l0: #E7F1EE; --l1: #CDE6DE; --l2: #A9D5C7; --l3: #7DBFAC; --l4: #3E9C85; --l5: #1E7F69; --l6: #0B5546;
  --l-ink-lo: #10342B; --l-ink-hi: #FFFFFF;
  --shadow: 0 1px 2px rgba(16, 40, 33, .06), 0 8px 24px rgba(16, 40, 33, .08);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1311; --surface: #131C19; --sunken: #1A2521; --ink: #E2ECE8; --muted: #93A59E; --line: #263530;
    --accent: #52C4A9; --accent-ink: #052019; --accent-soft: #15342C;
    --hold: #FF8E7E; --hold-soft: #3A1915; --warn: #F0B84C; --warn-soft: #33270E; --ok: #6DD399; --ok-soft: #11301F;
    --l0: #1C2C27; --l1: #1E3D34; --l2: #1F5244; --l3: #226855; --l4: #2D8A72; --l5: #43A98E; --l6: #7BD3BA;
    --l-ink-lo: #DDF1EA; --l-ink-hi: #06231C;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1311; --surface: #131C19; --sunken: #1A2521; --ink: #E2ECE8; --muted: #93A59E; --line: #263530;
  --accent: #52C4A9; --accent-ink: #052019; --accent-soft: #15342C;
  --hold: #FF8E7E; --hold-soft: #3A1915; --warn: #F0B84C; --warn-soft: #33270E; --ok: #6DD399; --ok-soft: #11301F;
  --l0: #1C2C27; --l1: #1E3D34; --l2: #1F5244; --l3: #226855; --l4: #2D8A72; --l5: #43A98E; --l6: #7BD3BA;
  --l-ink-lo: #DDF1EA; --l-ink-hi: #06231C;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 28px; line-height: 1.15; }
h2 { font-size: 19px; line-height: 1.25; }
h3 { font-size: 15px; line-height: 1.3; }
p { margin: 0; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 20px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { flex: none; }
.b1 { font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.1; }
.b2 { font-size: 12px; color: var(--muted); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
.navbtn { border: 0; background: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 600; }
.navbtn:hover { background: var(--sunken); color: var(--ink); }
.navbtn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.modechip { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.modechip.live .dot { background: var(--ok); }
.modechip.demo .dot { background: var(--warn); }

main { padding-block: 24px 64px; display: grid; gap: 20px; }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.banner .btn { margin-left: auto; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--hold); border-color: color-mix(in oklab, var(--hold) 40%, var(--line)); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 8px; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* level pills */
.lvl { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; padding: 2px 7px; border-radius: 6px; font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
.l0 { background: var(--l0); color: var(--l-ink-lo); } .l1 { background: var(--l1); color: var(--l-ink-lo); }
.l2 { background: var(--l2); color: var(--l-ink-lo); } .l3 { background: var(--l3); color: var(--l-ink-lo); }
.l4 { background: var(--l4); color: var(--l-ink-hi); } .l5 { background: var(--l5); color: var(--l-ink-hi); }
.l6 { background: var(--l6); color: var(--l-ink-hi); }
.lvlname { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }

/* chips */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--sunken); color: var(--muted); }
.chip.hold { background: var(--hold-soft); color: var(--hold); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }

/* department mix */
.mix { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; }
.mixcol { display: grid; gap: 6px; text-align: center; min-width: 0; }
.mixbar { border-radius: 6px 6px 2px 2px; min-height: 6px; }
.mixn { font-family: var(--f-mono); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.mixlab { font-size: 11.5px; color: var(--muted); line-height: 1.25; overflow-wrap: anywhere; }
.mixgroups { display: grid; grid-template-columns: 4fr 2fr 1fr; gap: 6px; margin-top: 4px; }
.mixgroups div { border-top: 2px solid var(--line); padding-top: 4px; font-size: 11.5px; color: var(--muted); text-align: center; }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; background: var(--sunken); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: color-mix(in oklab, var(--accent-soft) 45%, transparent); }
.rname { font-weight: 600; }
.nextcell { max-width: 300px; color: var(--muted); font-size: 13px; }

.search { width: 100%; max-width: 320px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.empty { text-align: left; display: grid; gap: 14px; padding: 28px; }
.empty p { max-width: 60ch; }

/* resident page */
.rhead { display: grid; gap: 12px; }
.back { justify-self: start; }
.rtitle { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.facts { display: flex; gap: 28px; flex-wrap: wrap; }
.fact .v { font-family: var(--f-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; }
.tick { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-top: 1px; }
.tick.ok { background: var(--ok); color: var(--surface); }
.tick.todo { border: 2px solid var(--line); }
.tick.block { background: var(--hold); color: var(--surface); }

.progress { height: 8px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* ladder */
.ladder { display: grid; gap: 0; }
.rung { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.rung:last-child { border-bottom: 0; }
.rung.future { opacity: .55; }
.rung.now .rname::after { content: "Current"; margin-left: 8px; font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }

/* requirements */
.reqrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.reqrow:last-child { border-bottom: 0; }
.reqdates { display: flex; gap: 8px; flex-wrap: wrap; }
.reqdates label { display: grid; gap: 2px; font-size: 11px; color: var(--muted); }
input[type="date"], input[type="number"], input[type="text"], select, textarea { border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; background: var(--surface); min-width: 0; }
input[type="number"] { width: 84px; }
textarea { width: 100%; resize: vertical; }

/* surgical ladder */
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.step { height: 8px; border-radius: 3px; background: var(--sunken); }
.step.on { background: var(--accent); }
.step.lock { background: repeating-linear-gradient(45deg, var(--sunken), var(--sunken) 3px, var(--line) 3px, var(--line) 6px); }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(8, 20, 16, .45); z-index: 20; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: 100%; max-width: 760px; display: grid; }
.modal.narrow { max-width: 520px; }
.mhead { padding: 18px 20px 12px; display: grid; gap: 4px; border-bottom: 1px solid var(--line); }
.mbody { padding: 16px 20px; display: grid; gap: 18px; }
.mfoot { padding: 12px 20px 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--surface); border-radius: 0 0 14px 14px; }
.mfoot .left { margin-right: auto; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 12.5px; font-weight: 600; }
.field input[type="text"], .field select { width: 100%; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.msel { display: inline-flex; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; font-family: var(--f-mono); font-size: 12.5px; min-width: 34px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button[aria-pressed="true"].bad { background: var(--hold); color: var(--surface); }
.seg button[aria-pressed="true"].mid { background: var(--warn); color: var(--surface); }
.duty { display: grid; grid-template-columns: minmax(0, 1fr) auto 64px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.duty:last-child { border-bottom: 0; }
.duty .pts { text-align: right; font-family: var(--f-mono); }
.evrow { display: grid; grid-template-columns: 110px 150px minmax(0, 1fr) minmax(0, 140px) auto; gap: 8px; align-items: center; }
.evrow input, .evrow select { width: 100%; }
.summary { display: flex; gap: 6px 18px; flex-wrap: wrap; align-items: baseline; padding: 12px 14px; border-radius: 10px; background: var(--sunken); }
.summary .tot { margin-left: auto; font-family: var(--f-mono); font-size: 22px; font-weight: 600; }
.note { padding: 10px 12px; border-radius: 8px; background: var(--sunken); font-size: 13px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.hold { background: var(--hold-soft); color: var(--hold); }
.imp-table td, .imp-table th { padding: 6px 8px; font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 30; font-weight: 600; box-shadow: var(--shadow); }

.rules table td, .rules table th { font-size: 13px; }
.rules ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

@media (max-width: 640px) {
  h1 { font-size: 24px; }
  .evrow { grid-template-columns: 1fr 1fr; }
  .evrow .wide { grid-column: 1 / -1; }
  .duty { grid-template-columns: minmax(0, 1fr) 56px; }
  .duty .seg { grid-column: 1 / -1; justify-self: start; }
  .duty .pts { grid-row: 1; grid-column: 2; }
  .reqrow { grid-template-columns: 22px minmax(0, 1fr); }
  .reqdates { grid-column: 2; }
  .mix { gap: 3px; }
  .rung { grid-template-columns: 48px 1fr; }
  .rung > span.small { display: none; }
  .mixlab { font-size: 10px; }
}
@media (prefers-reduced-motion: no-preference) {
  .scrim { animation: fade .12s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}

/* theatre and step ladders */
.ltable td, .ltable th { padding: 8px 10px; }
.ltable td.stepname { min-width: 180px; }
.stepstate { white-space: nowrap; }
.plan { display: grid; gap: 10px; }
.plancase { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
.planrow { display: grid; grid-template-columns: minmax(120px, 180px) minmax(0, 1fr); gap: 4px 12px; align-items: start; padding: 6px 0; border-top: 1px dashed var(--line); }
.planrow:first-of-type { border-top: 0; }
.why { font-size: 12.5px; color: var(--muted); }
.pickgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 12px; }
.pickgrid label { display: flex; gap: 8px; align-items: center; padding: 3px 0; min-width: 0; }
.caserow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.recstep { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 170px); gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.recstep:last-child { border-bottom: 0; }
.seg button.txt { font-family: var(--f-body); min-width: 0; }
@media (max-width: 640px) {
  .planrow { grid-template-columns: 1fr; }
  .recstep { grid-template-columns: 1fr; }
}
</style>

<script>
/* ======================================================================
   Program rules, from the Neurosurgery Residency Progression System doc.
   All values are the doc's proposed starting values; edit here to calibrate.
   ====================================================================== */
const LEVELS = [
  { key: "att", code: "ATT", name: "Attached", calls: "No duties" },
  { key: "j4", code: "J4", name: "4-day junior", calls: "4 on-call days a week" },
  { key: "j3", code: "J3", name: "3-day junior", calls: "3 on-call days a week" },
  { key: "j2", code: "J2", name: "2-day junior", calls: "2 on-call days a week" },
  { key: "m2", code: "MS2", name: "2-day midsenior", calls: "2 on-call days a week" },
  { key: "m1", code: "MS1", name: "1-day midsenior", calls: "1 on-call day a week" },
  { key: "sr", code: "SR", name: "Senior", calls: "1 on-call day a week" },
];
const LVL = Object.fromEntries(LEVELS.map((l, i) => [l.key, i]));
const RULE = {
  j3Points: 500, j3Cut: 6, j2Points: 1500, msCut: 18, m1Points: 2500, srCut: 30,
  passMark: 60, exam1After: 6, exam2After: 21, retakeAfter: 3,
  minor: 3, major: 15, bonusCap: 5, criticalHold: 3,
  boostAvg: 90, srII: 85, srIII: 92, tierReviewMonths: 6,
  openingPoints: 80, transitionMonths: 2,
  lpBackup: 10, lpBackupBoost: 8, lpAttempts: 2,
  wMerit: 0.4, wLearn: 30, wLearnDone: 10, wFair: 30, fairFactor: 1.5,
};
const REQ_TEXT = {
  att: ["Knows the hospital layout", "Can write an admission", "Can write a blood reservation", "Knows the principles of documentation", "Knows how to inform a senior with patient data"],
  j4: ["Indications for CT brain", "Red flags on CT brain", "Initial ER assessment of trauma patients", "Lateralization and uncal herniation", "Basics of the neurological examination", "Preparation of an ER surgical case"],
  j3: ["Can run a 24-hour ER shift", "Full documentation", "Operating list preparation", "Assessment of ward cases", "Reads CT brain and detects trauma findings", "Full informing on ER patients", "Fast, adequate preparation of ER surgical cases", "Can present a case"],
  m2: ["Advanced CT brain: edema, hydrocephalus, midline shift and basic measurements", "Surgical indications and ER surgeries", "Can prepare a list", "Can present a full grand round", "Can clear an ER patient who is free of neurosurgical findings", "Can inform specialists and consultants on ward and consultation cases", "Can run a shift when the senior is not available", "Can write the handover notes for the next shift", "Can make a plan for each patient"],
};
const REQS = Object.fromEntries(Object.entries(REQ_TEXT).map(([k, list]) => [k, list.map((t, n) => ({ id: k + "-" + (n + 1), text: t }))]));
const REQ_LEVELS = [0, 1, 2, 4];
const DUTIES = {
  j4: [["On-call shifts attended on time and covered in full", 15], ["Informing on ER patients", 10], ["Preparing ER surgical cases", 10], ["Admission sheets", 8], ["Progress notes, some written personally under supervision", 7]],

/* Split a laddered case's steps among the team, lowest on the ladder first. */

  const ordered = members.slice().sort((a, b) => surg(S.residents[a.id]).learnIndex(proc) - surg(S.residents[b.id]).learnIndex(proc));
  let pos = 0;
  const team = ordered.map(m => {
    const st = surg(S.residents[m.id]);
    const L = st.learning(proc);
    const learnAt = L ? caseSteps.indexOf(L) : caseSteps.length - 1;
    const upto = learnAt < 0 ? caseSteps.findIndex(k => !st.complete(k)) - 1 : learnAt;
    let end = pos - 1;
    for (let k = pos; k <= Math.min(upto < 0 ? caseSteps.length - 1 : upto, caseSteps.length - 1); k++) { if (!st.allowed(proc, caseSteps[k])) break; end = k; }
    const steps = caseSteps.slice(pos, end + 1);
    pos = Math.max(pos, end + 1);
    const boosted = steps.filter(k => k === st.boostStep(proc));
    let why = steps.length ? (L && steps.includes(L) ? `Learning ${STEP[L][0].toLowerCase()}` : "Completed steps up to their ceiling") : "Observes: no steps left at their position on this ladder";
    if (boosted.length) why += `. ${STEP[boosted[0]][0]} is one step above their ceiling with the boost, so the specialist must be scrubbed`;
    return Object.assign({}, m, { steps, role: steps.length ? "performs" : "observes", why: (m.why ? m.why + ". " : "") + why });
  });
  return { team, specialistSteps: caseSteps.slice(pos) };
}
function planEmergency(proc, rids, ym) {
  if (proc === "lp") return planLP(rids);
  const steps = PROCS[proc].steps;
  const cand = rids.map(id => ({ id, g: groupOf(run(S.residents[id]).level), pri: priority(id, proc, steps, ym) }));
  const placed = [], observers = [];
  ["J", "M", "S"].forEach(g => {
    const list = cand.filter(c => c.g === g).sort(byPriority);
    if (!list.length) return;
    placed.push(Object.assign({}, list[0], { why: list.length > 1 ? priText(list[0].pri) : "" }));
    list.slice(1).forEach(o => observers.push({ id: o.id, steps: [], role: "observes", why: `Observes: same level as ${nm(list[0].id)}, who has the higher priority score. ${priText(o.pri)}` }));
  });
  cand.filter(c => c.g === "A").forEach(o => observers.push({ id: o.id, steps: [], role: "observes", why: "Attached residents observe" }));
  const sp = splitSteps(proc, steps, placed);
  return { team: sp.team.concat(observers), specialistSteps: sp.specialistSteps };
}
function planLP(rids) {
  const list = rids.filter(id => run(S.residents[id]).level >= 1).map(id => ({ id, n: surg(S.residents[id]).lp, backupOK: surg(S.residents[id]).lpBackup }));
  if (!list.length) return { team: [], specialistSteps: [], lp: {} };
  const learner = list.slice().sort((a, b) => a.n - b.n || (cxOf(a.id).lastDate || "").localeCompare(cxOf(b.id).lastDate || ""))[0];
  const backup = list.filter(x => x.id !== learner.id && x.backupOK).sort((a, b) => b.n - a.n)[0];
  const team = [{ id: learner.id, steps: [], role: "performs", why: `Fewest successful punctures on the team (${learner.n}). Up to ${RULE.lpAttempts} attempts.` }];
  if (backup) team.push({ id: backup.id, steps: [], role: "backup", why: `Backup: ${backup.n} successful punctures. Records the result.` });
  list.filter(x => x.id !== learner.id && (!backup || x.id !== backup.id)).forEach(x => team.push({ id: x.id, steps: [], role: "observes", why: "Observes" }));
  return { team, specialistSteps: [], lp: { learner: learner.id, backup: backup ? backup.id : null }, noBackup: !backup };
}
function planList(cases, unavailable, ym) {
  const extra = {};
  const used = new Set();
  const pool = Object.keys(S.residents).filter(id => !unavailable.includes(id) && run(S.residents[id]).level >= 1);
  const slots = [];
  cases.forEach((c, ci) => ["S", "M", "J"].forEach(g => slots.push({ ci, g, id: null, why: "" })));
  const cnt = id => casesThisMonth(id, ym) + (extra[id] || 0);
  const minOf = id => SURG_MIN[LEVELS[run(S.residents[id]).level].key] || 0;
  const place = (slot, id, why) => { slot.id = id; slot.why = why; used.add(id); extra[id] = (extra[id] || 0) + 1; };
  // round 1: minimums, furthest behind first
  slots.forEach(slot => {
    const c = pool.filter(id => !used.has(id) && groupOf(run(S.residents[id]).level) === slot.g && cnt(id) < minOf(id))
      .sort((a, b) => (minOf(b) - cnt(b)) - (minOf(a) - cnt(a)) || (cxOf(a).lastDate || "").localeCompare(cxOf(b).lastDate || ""));
    if (c.length) place(slot, c[0], `Below the monthly minimum (${cnt(c[0])} of ${minOf(c[0])} cases)`);
  });
  // round 2: reward pool by priority score
  slots.filter(s => !s.id).forEach(slot => {
    const cs = cases[slot.ci], steps = cs.steps || [];
    const c = pool.filter(id => { const E = run(S.residents[id]); return !used.has(id) && groupOf(E.level) === slot.g && !E.holdNow && !E.rewardExcluded; })
      .map(id => ({ id, pri: priority(id, cs.proc, steps, ym, extra[id] || 0) })).sort(byPriority);
    if (c.length) place(slot, c[0].id, `Reward pool. ${priText(c[0].pri)}`);
    else slot.why = `No ${GROUP_NAME[slot.g].toLowerCase()} available`;
  });
  return cases.map((cs, ci) => {
    const members = slots.filter(s => s.ci === ci && s.id).map(s => ({ id: s.id, why: s.why, g: s.g }));
    const empty = slots.filter(s => s.ci === ci && !s.id).map(s => s.why);
    if (cs.proc === "adv") {
      const closer = members.find(m => m.g === "M") || members.find(m => m.g === "S");
      const team = members.map(m => {
        const tier = m.g === "S" ? seniorTier(S.residents[m.id], run(S.residents[m.id])) : null;
        const role = m === closer ? "closes" : m.g === "J" ? "observes" : "assists";
        let extraWhy = m === closer ? "Closes the wound" : m.g === "J" ? "Observes" : "Assists the specialist";
        if (tier && tier.n >= 2) extraWhy += tier.n === 3 ? ". Senior III: further steps at the specialist's discretion" : ". Senior II: approach steps (incision, exposure, hemostasis)";
        return { id: m.id, steps: [], role, why: m.why + ". " + extraWhy };
      });
      return { team, specialistSteps: [], empty };
    }
    const sp = splitSteps(cs.proc, cs.steps, members);
    return { team: sp.team, specialistSteps: sp.specialistSteps, empty };
  });
}

/* ---------- next step text ---------- */
function nextStep(res, E) {
  const L = E.level, items = [], start = startOf(res);
  const cutYM = n => ymAdd(start, n - 1);
  let title, sub = "", early = null;
  const examItem = n => {
    const p = examPassed(res, n);
    if (p) return { state: "ok", text: `Exam ${n} passed${p.month ? " (" + ymLabel(p.month) + (p.score != null ? ", " + p.score + "/100" : "") + ")" : " before launch"}` };
    return { state: "todo", text: `Exam ${n} not passed. Can sit from ${ymLabel(examEligibleFrom(res, n))}.` };
  };
  const reqItem = lvls => { const [s, t] = reqCount(res, lvls); return { state: s === t ? "ok" : "todo", text: `Requirements signed off: ${s} of ${t}` }; };
  const ptsItem = thr => ({ state: E.cum >= thr ? "ok" : "todo", text: `${fmt(E.cum)} of ${thr.toLocaleString("en-US")} points`, pct: Math.min(100, E.cum / thr * 100) });
  const pace = (thr, cut) => {
    if (E.cum >= thr || !E.avg3) return "";
    const reach = E.lastIdx + Math.ceil((thr - E.cum) / E.avg3);
    return reach < cut ? `At the recent average of ${fmt(E.avg3)}, they reach ${thr.toLocaleString("en-US")} points in month ${reach} (${ymLabel(cutYM(reach))}), ahead of the cut.` : `At the recent average of ${fmt(E.avg3)}, the ${cut}-month cut comes first.`;
  };
  if (L === 0) { title = "Next: 4-day junior"; sub = "Moves up at the end of the first month in which the attached requirements are signed off."; items.push(reqItem([0])); }
  else if (L === 1) {
    title = "Next: 3-day junior";
    sub = `Automatically at the end of month ${RULE.j3Cut}, effective ${ymLabel(cutYM(RULE.j3Cut + 1))}. Earlier with 500 points and the requirements below signed off.`;
    items.push(ptsItem(RULE.j3Points), reqItem([0, 1]));
    const p = pace(RULE.j3Points, RULE.j3Cut); if (p) items.push({ state: "info", text: p });
  } else if (L === 2 || L === 3) {
    title = "Next: 2-day midsenior";
    sub = E.i > RULE.msCut && !examPassed(res, 1) ? "The 18-month cut has passed. They move up the month after passing Exam 1." : `At the end of month ${RULE.msCut} with Exam 1 passed, effective ${ymLabel(cutYM(RULE.msCut + 1))}.`;
    items.push(examItem(1));
    if (L === 2 && E.i <= RULE.msCut) {
      early = { title: "Early step: 2-day junior", items: [ptsItem(RULE.j2Points), examItem(1), reqItem([0, 1, 2])] };
      const p = pace(RULE.j2Points, RULE.msCut); if (p) early.items.push({ state: "info", text: p });
    }
  } else if (L === 4 || L === 5) {
    title = "Next: Senior";
    sub = E.i > RULE.srCut && !examPassed(res, 2) ? "The 30-month cut has passed. They move up the month after passing Exam 2." : `At the end of month ${RULE.srCut} with Exam 2 passed, effective ${ymLabel(cutYM(RULE.srCut + 1))}.`;
    items.push(examItem(2));
    if (L === 4 && E.i <= RULE.srCut) {
      early = { title: "Early step: 1-day midsenior", items: [ptsItem(RULE.m1Points), examItem(2), reqItem([0, 1, 2, 4])] };
      const p = pace(RULE.m1Points, RULE.srCut); if (p) early.items.push({ state: "info", text: p });
    }
  } else {
    const t = seniorTier(res, E);
    title = `Senior ${["I", "II", "III"][t.n - 1]}`;
    sub = t.firstReview ? `Every senior starts at Senior I. Tiers are first reviewed after ${RULE.tierReviewMonths} months of scores (${E.scoredSince} so far).` : "Tiers follow the running 6-month average, are reviewed every 6 months, and can go down as well as up.";
    items.push({ state: t.avg6 >= RULE.srII ? "ok" : "todo", text: `6-month average: ${fmt(t.avg6)} (Senior II needs ${RULE.srII}, Senior III needs ${RULE.srIII})` });
    items.push({ state: t.hold6 ? "block" : "ok", text: t.hold6 ? "A hold in the last 6 months" : "No hold in the last 6 months" });
    items.push({ state: t.hold12 ? "todo" : "ok", text: t.hold12 ? "A hold in the last 12 months (blocks Senior III)" : "No hold in the last 12 months" });
    items.push({ state: t.emergencyDone ? "ok" : "todo", text: t.emergencyDone ? "Every basic emergency ladder completed" : "Senior III needs every basic emergency ladder completed" });
  }
  if (E.holdNow) items.unshift({ state: "block", text: `On hold through ${ymLabel(ymAdd(start, E.holdEnd - 1))}. No upgrade by points or by time, and no surgical rewards, until it ends.` });
  return { title, sub, items, early };
}
function shortNext(res, E) {
  if (res.start && E.i < 1) return "Starts " + ymLabel(res.start);
  if (E.holdNow) return "On hold through " + ymLabel(ymAdd(startOf(res), E.holdEnd - 1));
  const L = E.level, s = startOf(res);
  if (L === 0) { const [a, t] = reqCount(res, [0]); return `Attached requirements ${a}/${t}`; }
  if (L === 1) return `3-day junior from ${ymLabel(ymAdd(s, RULE.j3Cut))}`;
  if (L === 2 || L === 3) return examPassed(res, 1) ? `Midsenior from ${ymLabel(ymAdd(s, RULE.msCut))}` : E.i > RULE.msCut ? "Midsenior once Exam 1 is passed" : `Midsenior from ${ymLabel(ymAdd(s, RULE.msCut))}, needs Exam 1`;
  if (L === 4 || L === 5) return examPassed(res, 2) ? `Senior from ${ymLabel(ymAdd(s, RULE.srCut))}` : E.i > RULE.srCut ? "Senior once Exam 2 is passed" : `Senior from ${ymLabel(ymAdd(s, RULE.srCut))}, needs Exam 2`;
  return `Senior ${["I", "II", "III"][seniorTier(res, E).n - 1]}`;
}
function statusChips(res, E) {
  const c = [];
  if (E.holdNow) c.push(`<span class="chip hold">On hold</span>`);
  if (E.committee) c.push(`<span class="chip hold">Committee review</span>`);
  if (E.unscored) c.push(`<span class="chip warn">${E.unscored} month${E.unscored > 1 ? "s" : ""} unscored</span>`);
  if (surg(res).overdue.length) c.push(`<span class="chip warn">Surgical remediation</span>`);
  if (E.rewardExcluded) c.push(`<span class="chip warn">No reward-pool cases</span>`);
  if (E.boost) c.push(`<span class="chip accent">Boost</span>`);
  return c.join("");
}

let toastTimer;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}
const dbErr = e => e && e.code === "quota_exceeded" ? "The tracker's storage is full." : e && e.code === "invalid_argument" ? "You need edit access to change records." : "Could not save. Check your connection and try again.";
const local = () => S.mode !== "live";
async function patchResident(id, patch, msg) {
  if (local()) { S.residents[id] = deepMerge(clone(S.residents[id]), patch); S.residents[id]._id = id; invalidate(); render(); if (msg) toast(msg); return true; }
  try { await S.db.doc("residents/" + id).update(patch); if (msg) toast(msg); return true; } catch (e) { toast(dbErr(e)); return false; }
}
async function setResident(id, obj) {
  const body = clone(obj); delete body._id;
  if (local()) { S.residents[id] = Object.assign(body, { _id: id }); invalidate(); render(); return true; }
  try { await S.db.doc("residents/" + id).set(body); return true; } catch (e) { toast(dbErr(e)); return false; }
}
async function createResident(obj) {
  const id = local() ? "r" + uid() : S.db.collection("residents").doc().id;
  return (await setResident(id, obj)) ? id : null;
}
async function deleteResident(id) {
  if (local()) { delete S.residents[id]; invalidate(); render(); return; }
  try { await S.db.doc("residents/" + id).delete(); } catch (e) { toast(dbErr(e)); }

async function saveCases(map) { // map: {id: caseObj|null}
  const byYM = {};
  Object.entries(map).forEach(([id, c]) => { const ym = c ? c.date.slice(0, 7) : (allCases().find(x => x.id === id) || {}).ym; if (ym) (byYM[ym] = byYM[ym] || {})[id] = c; });
  for (const [ym, items] of Object.entries(byYM)) {
    if (local()) { const d = S.caseDocs[ym] = S.caseDocs[ym] || { items: {} }; Object.assign(d.items, clone(items)); continue; }
    try {
      if (S.caseDocs[ym]) await S.db.doc("cases/" + ym).update({ items });
      else await S.db.doc("cases/" + ym).set({ items });
    } catch (e) { toast(dbErr(e)); return false; }
  }
  if (local()) { invalidate(); render(); }
  return true;
}

  if (local()) { Object.assign(S.settings, patch); invalidate(); render(); return true; }

function residentView() {

function parseLevel(s) {
  const k = String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const map = { attached: 0, att: 0, "4dayjunior": 1, "4day": 1, j4: 1, "3dayjunior": 2, "3day": 2, j3: 2, "2dayjunior": 3, j2: 3, "2daymidsenior": 4, ms2: 4, m2: 4, midsenior: 4, "1daymidsenior": 5, ms1: 5, m1: 5, senior: 6, sr: 6 };
  return k in map ? map[k] : null;
}
function parseYM(s) {
  s = String(s || "").trim(); let m;
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})$/))) return m[1] + "-" + m[2].padStart(2, "0");
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{4})$/))) return m[2] + "-" + m[1].padStart(2, "0");
  if ((m = s.match(/^([a-z]{3})[a-z]*\.?\s+(\d{4})$/i))) { const k = MONTHS.findIndex(x => x.toLowerCase() === m[1].toLowerCase()); if (k >= 0) return m[2] + "-" + String(k + 1).padStart(2, "0"); }
  return null;
}
function parseImport(text) {
  return String(text || "").split(/\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const p = line.split(/\t|,|;/).map(x => x.trim());
    const out = { name: p[0], start: parseYM(p[1]), level: p[2] ? parseLevel(p[2]) : null, err: "" };
    if (!out.name) out.err = "Missing name";
    else if (!out.start) out.err = "Start month not recognised";
    else if (p[2] && out.level == null) out.err = "Level not recognised";
    else if (out.level == null && out.start < ymNow()) out.err = "Add their current level";
    return out;
  });
}

    }
    case "case-open": { const c = allCases().find(x => x.id === el.dataset.id); if (c) openModal({ type: "record", id: c.id, draft: clone(c) }); break; }
    case "rec-o": { const d = m.draft; d.perf = d.perf || {}; const r = d.perf[el.dataset.r] = d.perf[el.dataset.r] || {}; const cur = r[el.dataset.k] || {}; r[el.dataset.k] = cur.o === el.dataset.v ? null : { o: el.dataset.v, by: cur.by || d.specialist || "" }; renderModal(); break; }
    case "rec-lp": m.draft.lp = Object.assign({}, m.draft.lp, { result: el.dataset.v }); renderModal(); break;

function onField(e) {

    }

    else d[f] = t.type === "checkbox" ? t.checked : t.value;
    if (t.dataset.rerender != null) rerender = true;
  } else if (t.dataset.ev != null) { d.events[+t.dataset.ev][t.dataset.f] = t.value; if (t.dataset.f === "tier" && e.type === "change") rerender = true; }
  else if (t.dataset.bn != null) d.bonuses[+t.dataset.bn][t.dataset.f] = t.value;
  else if (t.dataset.pick) { if (e.type !== "change") return; const set = new Set(d[t.dataset.pick]); t.checked ? set.add(t.value) : set.delete(t.value); d[t.dataset.pick] = [...set]; rerender = true; }
  else if (t.dataset.lc != null) d.cases[+t.dataset.lc][t.dataset.f] = t.value;
  else if (t.dataset.lstep != null) { if (e.type !== "change") return; const c = d.cases[+t.dataset.lstep]; c.steps = t.checked ? c.steps.concat([t.value]) : c.steps.filter(s => s !== t.value); sortSteps(c); rerender = true; }
  else if (t.dataset.ratt != null) d.team[+t.dataset.ratt].attended = t.checked;
  else if (t.dataset.rby) { d.perf = d.perf || {}; const r = d.perf[t.dataset.rby] = d.perf[t.dataset.rby] || {}; r[t.dataset.k] = Object.assign({}, r[t.dataset.k], { by: t.value }); if (!r[t.dataset.k].o) delete r[t.dataset.k].o; }
  if (m.type === "em" && t.dataset.m === "date" && e.type === "change") rerender = true;
  if (rerender) { renderModal(); return; }
  if (m.type === "score") { const box = document.getElementById("sc-summary"); if (box) box.innerHTML = scoreSummary(); }
}

  const fail = () => { S.mode = "offline"; render(); toast("Lost the connection to the shared tracker. Reload to reconnect."); };
  db.collection("residents").onSnapshot(snap => { S.residents = Object.fromEntries(snap.docs.map(d => [d.id, Object.assign({}, d.data(), { _id: d.id })])); S.loaded.residents = true; live(); }, fail);
  db.collection("cases").onSnapshot(snap => { S.caseDocs = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); S.loaded.cases = true; live(); }, fail);
  db.doc("settings/program").onSnapshot(snap => { if (snap.exists) S.settings = Object.assign({ launch: "2026-10", specialists: [] }, snap.data()); invalidate(); render(); }, () => {});
})();
</script>
