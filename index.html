<style>
/* Layout: a ward-office tool. Sticky top bar, one working column up to 1180px; tables scroll inside their own frames. */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --sunken: #E8EEEC;
  --ink: #13201C;
  --muted: #55655F;
  --line: #D5DFDB;
  --accent: #0D6A58;
  --accent-ink: #FFFFFF;
  --accent-soft: #DCEFE9;
  --hold: #B42318;
  --hold-soft: #FCE8E6;
  --warn: #8F5400;
  --warn-soft: #FAEFD8;
  --ok: #1B7742;
  --ok-soft: #E1F2E7;
  --l0: #E7F1EE; --l1: #CDE6DE; --l2: #A9D5C7; --l3: #7DBFAC; --l4: #3E9C85; --l5: #1E7F69; --l6: #0B5546;
  --l-ink-lo: #10342B; --l-ink-hi: #FFFFFF;
  --shadow: 0 1px 2px rgba(16, 40, 33, .06), 0 8px 24px rgba(16, 40, 33, .08);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1311; --surface: #131C19; --sunken: #1A2521; --ink: #E2ECE8; --muted: #93A59E; --line: #263530;
    --accent: #52C4A9; --accent-ink: #052019; --accent-soft: #15342C;
    --hold: #FF8E7E; --hold-soft: #3A1915; --warn: #F0B84C; --warn-soft: #33270E; --ok: #6DD399; --ok-soft: #11301F;
    --l0: #1C2C27; --l1: #1E3D34; --l2: #1F5244; --l3: #226855; --l4: #2D8A72; --l5: #43A98E; --l6: #7BD3BA;
    --l-ink-lo: #DDF1EA; --l-ink-hi: #06231C;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1311; --surface: #131C19; --sunken: #1A2521; --ink: #E2ECE8; --muted: #93A59E; --line: #263530;
  --accent: #52C4A9; --accent-ink: #052019; --accent-soft: #15342C;
  --hold: #FF8E7E; --hold-soft: #3A1915; --warn: #F0B84C; --warn-soft: #33270E; --ok: #6DD399; --ok-soft: #11301F;
  --l0: #1C2C27; --l1: #1E3D34; --l2: #1F5244; --l3: #226855; --l4: #2D8A72; --l5: #43A98E; --l6: #7BD3BA;
  --l-ink-lo: #DDF1EA; --l-ink-hi: #06231C;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; text-wrap: balance; margin: 0; letter-spacing: -.01em; }
h1 { font-size: 28px; line-height: 1.15; }
h2 { font-size: 19px; line-height: 1.25; }
h3 { font-size: 15px; line-height: 1.3; }
p { margin: 0; }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 20px; padding-block: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.brand svg { flex: none; }
.b1 { font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.1; }
.b2 { font-size: 12px; color: var(--muted); }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
.navbtn { border: 0; background: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 600; }
.navbtn:hover { background: var(--sunken); color: var(--ink); }
.navbtn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.modechip { font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.modechip.live .dot { background: var(--ok); }
.modechip.demo .dot { background: var(--warn); }

main { padding-block: 24px 64px; display: grid; gap: 20px; }
.banner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.banner .btn { margin-left: auto; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--hold); border-color: color-mix(in oklab, var(--hold) 40%, var(--line)); }
.btn.ghost { border-color: transparent; background: none; color: var(--accent); padding-inline: 8px; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

.head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.head .actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.stack { display: grid; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* level pills */
.lvl { display: inline-flex; align-items: center; justify-content: center; min-width: 38px; padding: 2px 7px; border-radius: 6px; font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; letter-spacing: .02em; }
.l0 { background: var(--l0); color: var(--l-ink-lo); } .l1 { background: var(--l1); color: var(--l-ink-lo); }
.l2 { background: var(--l2); color: var(--l-ink-lo); } .l3 { background: var(--l3); color: var(--l-ink-lo); }
.l4 { background: var(--l4); color: var(--l-ink-hi); } .l5 { background: var(--l5); color: var(--l-ink-hi); }
.l6 { background: var(--l6); color: var(--l-ink-hi); }
.lvlname { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }

/* chips */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; background: var(--sunken); color: var(--muted); }
.chip.hold { background: var(--hold-soft); color: var(--hold); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }

/* department mix */
.mix { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; }
.mixcol { display: grid; gap: 6px; text-align: center; min-width: 0; }
.mixbar { border-radius: 6px 6px 2px 2px; min-height: 6px; }
.mixn { font-family: var(--f-mono); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.mixlab { font-size: 11.5px; color: var(--muted); line-height: 1.25; overflow-wrap: anywhere; }
.mixgroups { display: grid; grid-template-columns: 4fr 2fr 1fr; gap: 6px; margin-top: 4px; }
.mixgroups div { border-top: 2px solid var(--line); padding-top: 4px; font-size: 11.5px; color: var(--muted); text-align: center; }

/* tables */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; background: var(--sunken); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; }
tbody tr.click { cursor: pointer; }
tbody tr.click:hover td { background: color-mix(in oklab, var(--accent-soft) 45%, transparent); }
.rname { font-weight: 600; }
.nextcell { max-width: 300px; color: var(--muted); font-size: 13px; }

.search { width: 100%; max-width: 320px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.empty { text-align: left; display: grid; gap: 14px; padding: 28px; }
.empty p { max-width: 60ch; }

/* resident page */
.rhead { display: grid; gap: 12px; }
.back { justify-self: start; }
.rtitle { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.facts { display: flex; gap: 28px; flex-wrap: wrap; }
.fact .v { font-family: var(--f-mono); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.checks li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: start; }
.tick { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; margin-top: 1px; }
.tick.ok { background: var(--ok); color: var(--surface); }
.tick.todo { border: 2px solid var(--line); }
.tick.block { background: var(--hold); color: var(--surface); }

.progress { height: 8px; background: var(--sunken); border-radius: 99px; overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

/* ladder */
.ladder { display: grid; gap: 0; }
.rung { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.rung:last-child { border-bottom: 0; }
.rung.future { opacity: .55; }
.rung.now .rname::after { content: "Current"; margin-left: 8px; font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; }

/* requirements */
.reqrow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.reqrow:last-child { border-bottom: 0; }
.reqdates { display: flex; gap: 8px; flex-wrap: wrap; }
.reqdates label { display: grid; gap: 2px; font-size: 11px; color: var(--muted); }
input[type="date"], input[type="number"], input[type="text"], select, textarea { border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; background: var(--surface); min-width: 0; }
input[type="number"] { width: 84px; }
textarea { width: 100%; resize: vertical; }

/* surgical ladder */
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.step { height: 8px; border-radius: 3px; background: var(--sunken); }
.step.on { background: var(--accent); }
.step.lock { background: repeating-linear-gradient(45deg, var(--sunken), var(--sunken) 3px, var(--line) 3px, var(--line) 6px); }

/* modal */
.scrim { position: fixed; inset: 0; background: rgba(8, 20, 16, .45); z-index: 20; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.modal { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: 100%; max-width: 760px; display: grid; }
.modal.narrow { max-width: 520px; }
.mhead { padding: 18px 20px 12px; display: grid; gap: 4px; border-bottom: 1px solid var(--line); }
.mbody { padding: 16px 20px; display: grid; gap: 18px; }
.mfoot { padding: 12px 20px 16px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: var(--surface); border-radius: 0 0 14px 14px; }
.mfoot .left { margin-right: auto; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 12.5px; font-weight: 600; }
.field input[type="text"], .field select { width: 100%; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.msel { display: inline-flex; gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 10px; cursor: pointer; font-family: var(--f-mono); font-size: 12.5px; min-width: 34px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button[aria-pressed="true"].bad { background: var(--hold); color: var(--surface); }
.seg button[aria-pressed="true"].mid { background: var(--warn); color: var(--surface); }
.duty { display: grid; grid-template-columns: minmax(0, 1fr) auto 64px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.duty:last-child { border-bottom: 0; }
.duty .pts { text-align: right; font-family: var(--f-mono); }
.evrow { display: grid; grid-template-columns: 110px 150px minmax(0, 1fr) minmax(0, 140px) auto; gap: 8px; align-items: center; }
.evrow input, .evrow select { width: 100%; }
.summary { display: flex; gap: 6px 18px; flex-wrap: wrap; align-items: baseline; padding: 12px 14px; border-radius: 10px; background: var(--sunken); }
.summary .tot { margin-left: auto; font-family: var(--f-mono); font-size: 22px; font-weight: 600; }
.note { padding: 10px 12px; border-radius: 8px; background: var(--sunken); font-size: 13px; }
.note.warn { background: var(--warn-soft); color: var(--warn); }
.note.hold { background: var(--hold-soft); color: var(--hold); }
.imp-table td, .imp-table th { padding: 6px 8px; font-size: 13px; }

.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 30; font-weight: 600; box-shadow: var(--shadow); }

.rules table td, .rules table th { font-size: 13px; }
.rules ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }

@media (max-width: 640px) {
  h1 { font-size: 24px; }
  .evrow { grid-template-columns: 1fr 1fr; }
  .evrow .wide { grid-column: 1 / -1; }
  .duty { grid-template-columns: minmax(0, 1fr) 56px; }
  .duty .seg { grid-column: 1 / -1; justify-self: start; }
  .duty .pts { grid-row: 1; grid-column: 2; }
  .reqrow { grid-template-columns: 22px minmax(0, 1fr); }
  .reqdates { grid-column: 2; }
  .mix { gap: 3px; }
  .rung { grid-template-columns: 48px 1fr; }
  .rung > span.small { display: none; }
  .mixlab { font-size: 10px; }
}
@media (prefers-reduced-motion: no-preference) {
  .scrim { animation: fade .12s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
}
</style>

<script>
/* ---------- Program rules (from the Neurosurgery Residency Progression System doc) ---------- */
const LEVELS = [
  { key: "att", code: "ATT", name: "Attached", calls: "No duties" },
  { key: "j4", code: "J4", name: "4-day junior", calls: "4 on-call days a week" },
  { key: "j3", code: "J3", name: "3-day junior", calls: "3 on-call days a week" },
  { key: "j2", code: "J2", name: "2-day junior", calls: "2 on-call days a week" },
  { key: "m2", code: "MS2", name: "2-day midsenior", calls: "2 on-call days a week" },
  { key: "m1", code: "MS1", name: "1-day midsenior", calls: "1 on-call day a week" },
  { key: "sr", code: "SR", name: "Senior", calls: "1 on-call day a week" },
];
const LVL = Object.fromEntries(LEVELS.map((l, i) => [l.key, i]));
const RULE = {
  j3Points: 500, j3Cut: 6, j2Points: 1500, msCut: 18, m1Points: 2500, srCut: 30,
  passMark: 60, exam1After: 6, exam2After: 21, retakeAfter: 3,
  minor: 3, major: 15, bonusCap: 5, criticalHold: 3,
  stepCases: 8, stepCasesBoost: 6, boostAvg: 90,
  srII: 85, srIII: 92,
};
const REQ_TEXT = {
  att: ["Knows the hospital layout", "Can write an admission", "Can write a blood reservation", "Knows the principles of documentation", "Knows how to inform a senior with patient data"],
  j4: ["Indications for CT brain", "Red flags on CT brain", "Initial ER assessment of trauma patients", "Lateralization and uncal herniation", "Basics of the neurological examination", "Preparation of an ER surgical case"],
  j3: ["Can run a 24-hour ER shift", "Full documentation", "Operating list preparation", "Assessment of ward cases", "Reads CT brain and detects trauma findings", "Full informing on ER patients", "Fast, adequate preparation of ER surgical cases", "Can present a case"],
  m2: ["Advanced CT brain: edema, hydrocephalus, midline shift and basic measurements", "Surgical indications and ER surgeries", "Can prepare a list", "Can present a full grand round", "Can clear an ER patient who is free of neurosurgical findings", "Can inform specialists and consultants on ward and consultation cases", "Can run a shift when the senior is not available", "Can write the handover notes for the next shift", "Can make a plan for each patient"],

const REQS = Object.fromEntries(Object.entries(REQ_TEXT).map(([k, list]) => [k, list.map((t, n) => ({ id: k + "-" + (n + 1), text: t }))]));
const REQ_LEVELS = [0, 1, 2, 4]; // levels that carry their own requirement list
const DUTIES = {
  j4: [["On-call shifts attended on time and covered in full", 15], ["Informing on ER patients", 10], ["Preparing ER surgical cases", 10], ["Admission sheets", 8], ["Progress notes, some written personally under supervision", 7]],
  j3: [["ER work carried forward: informing, admission sheets, surgical case preparation", 12], ["On-call shifts attended on time and covered in full", 10], ["Ward tasks for assigned patients, such as requested CTs and labs", 10], ["Progress notes for assigned cases", 7], ["Technical steps of list preparation", 6], ["Discharging assigned patients", 5]],
  j2: [["All ward cases, reporting to the midsenior", 14], ["Junior duties carried forward", 10], ["On-call shifts attended on time and covered in full", 8], ["Presenting ward cases in the grand round, with seniors as backup", 8], ["Assessment of the attached resident", 4], ["Teaching some of the examination lectures to juniors", 4], ["Shadowing midseniors", 2]],
  m2: [["On-call shifts attended on time and covered in full", 8], ["Full documentation for ward and ICU", 8], ["ICU patients", 8], ["Consultations", 7], ["Assessment of pre-operative and post-operative patients", 7], ["Supervising ER surgical case preparation", 4], ["Main presenter of the examination lectures", 3], ["Teaching juniors proper informing and ER assessment", 3], ["Helping with list preparation", 2]],
  m1: [["On-call shifts covered in full, including running the shift when the senior is not available", 10], ["Teaching: examination lectures, informing, ER assessment, CT brain and exam preparation", 8], ["Full documentation for ward and ICU", 7], ["ICU patients", 7], ["Consultations", 6], ["Assessment of pre-operative and post-operative patients", 6], ["Supervising ER surgical case preparation", 4], ["Helping with list preparation", 2]],
  sr: [["Running the shift", 8], ["Supervising every duty of the levels below", 7], ["Direct contact with the specialist and consultant, informing them of every important event", 7], ["List preparation: assessment, investigations and suitability", 6], ["A plan for each patient, in consultation with the specialist", 6], ["Reviewing the full documentation", 5], ["Handover notes for the next shift and list", 4], ["Presenting morbidity and mortality cases", 3], ["Grand round backup, holding all the data", 2], ["Presenting the lectures for Exam 2", 2]],
};
const SURG_MIN = { j4: 3, j3: 4, j2: 4, m2: 5, m1: 5, sr: 6 };
const BONUS = {
  cover: { label: "Covered a colleague's duty at short notice", short: "Covered a duty", pts: 3 },
  teach: { label: "Extra teaching session", short: "Extra teaching", pts: 2 },
  commend: { label: "Written commendation from a patient or staff member", short: "Commendation", pts: 2 },
};
const TIERS = {
  minor: { label: "Minor", hint: "Late to rounds or handover, incomplete notes, late logbook" },
  major: { label: "Major", hint: "Missed duty, unreachable on call, disrespect, leaving a task without handover, unexcused absence from a list" },
  critical: { label: "Critical", hint: "Dishonesty or falsified records, negligence endangering a patient, harassment, operating beyond privileges, concealing an error" },

const GROUPS = {
  A: { examples: "Burr holes, external ventricular drain, shunt insertion, wound closure", opens: 1, opensName: "Junior", expected: 18 },
  B: { examples: "Trauma craniotomy, decompressive craniectomy, lumbar discectomy and laminectomy, shunt revision", opens: 4, opensName: "Midsenior", expected: 36 },
  C: { examples: "Tumor craniotomy, posterior fossa surgery, spinal instrumentation", opens: 6, opensName: "Senior", expected: 54 },
};
const STEPS = ["Observe", "Assist", "Perform parts under direct supervision", "Whole procedure, consultant scrubbed", "Consultant in the suite, not scrubbed"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clone = o => JSON.parse(JSON.stringify(o ?? {}));
const round1 = n => Math.round(n * 10) / 10;
const fmt = n => n == null ? "–" : (Math.round(n * 10) / 10).toLocaleString("en-US", { maximumFractionDigits: 1 });
function ymNow() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
function todayISO() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function ymAdd(ym, n) { const [y, m] = ym.split("-").map(Number); const t = y * 12 + (m - 1) + n; return Math.floor(t / 12) + "-" + String((t % 12) + 1).padStart(2, "0"); }
function ymDiff(a, b) { const [ay, am] = a.split("-").map(Number), [by, bm] = b.split("-").map(Number); return (ay - by) * 12 + (am - bm); }
function ymLabel(ym) { if (!ym) return "–"; const [y, m] = ym.split("-"); return MONTHS[+m - 1] + " " + y; }
const validYM = s => /^\d{4}-(0[1-9]|1[0-2])$/.test(s || "");
function deepMerge(t, p) {
  for (const k in p) {
    const v = p[k];
    if (v && typeof v === "object" && !Array.isArray(v) && t[k] && typeof t[k] === "object" && !Array.isArray(t[k])) deepMerge(t[k], v);
    else t[k] = v && typeof v === "object" ? clone(v) : v;
  }
  return t;
}
const pill = i => `<span class="lvl l${i}">${LEVELS[i].code}</span>`;
const pillName = i => `<span class="lvlname">${pill(i)}${esc(LEVELS[i].name)}</span>`;

/* ---------- progression engine ---------- */
function reqSigned(res, id, ym) {
  const lvl = LVL[id.split("-")[0]];
  if (res.baseline && res.baseline.priorReqs && lvl < res.baseline.level) return true;
  const s = res.reqs && res.reqs[id];
  if (!s || !s.d1 || !s.d2) return false;
  const last = s.d1 > s.d2 ? s.d1 : s.d2;
  return !ym || last.slice(0, 7) <= ym;
}
const groupSigned = (res, lvl, ym) => REQS[LEVELS[lvl].key].every(r => reqSigned(res, r.id, ym));
const reqsThrough = (res, maxLvl, ym) => REQ_LEVELS.filter(l => l <= maxLvl).every(l => groupSigned(res, l, ym));
function reqCount(res, lvls) {
  let s = 0, t = 0;
  lvls.forEach(l => REQS[LEVELS[l].key].forEach(r => { t++; if (reqSigned(res, r.id)) s++; }));
  return [s, t];
}
const attempts = (res, n) => (res.exams && res.exams["e" + n]) || [];
const passedAttempt = a => a.passed === true || (a.score != null && +a.score >= RULE.passMark);
function examPassed(res, n, ym) {
  if (res.baseline && res.baseline["exam" + n]) return { month: null };
  const a = attempts(res, n).filter(a => passedAttempt(a) && (!ym || a.month <= ym)).sort((x, y) => x.month < y.month ? -1 : 1)[0];
  return a ? { month: a.month, score: a.score } : null;
}
function examEligibleFrom(res, n) {
  let from = ymAdd(res.start, (n === 1 ? RULE.exam1After : RULE.exam2After)); // "after 6 months" = from month 7
  attempts(res, n).forEach(a => { if (!passedAttempt(a)) { const r = ymAdd(a.month, RULE.retakeAfter); if (r > from) from = r; } });
  return from;
}

function scoreMonth(res, ym, lvlIdx) {
  const rec = res.months && res.months[ym];
  if (!rec) return null;
  const lk = rec.level || LEVELS[lvlIdx].key;
  const ev = rec.events || [];
  const minors = ev.filter(e => e.tier === "minor").length;
  const majors = ev.filter(e => e.tier === "major").length;
  const crit = ev.filter(e => e.tier === "critical").length;
  let duties = 0, surgery = 0, attachedPending = false;
  if (lk === "att") {
    const ok = groupSigned(res, 0, ym);
    duties = ok ? 50 : 0; surgery = ok ? 20 : 0; attachedPending = !ok;
  } else {
    (DUTIES[lk] || []).forEach(([, p], k) => { const m = +((rec.misses || [])[k] || 0); duties += m === 0 ? p : m <= 2 ? p / 2 : 0; });
    const as = +rec.assigned || 0, at = Math.min(+rec.attended || 0, as);
    surgery = as > 0 ? 20 * at / as : 20;
  }
  const low = r => r && r.level !== "att" && +r.assigned > 0 && (+r.attended || 0) < +r.assigned / 2;
  const autoMajor = low(rec) && low(res.months[ymAdd(ym, -1)]) ? 1 : 0;
  const deduct = minors * RULE.minor + (majors + autoMajor) * RULE.major;
  const behavior = crit > 0 ? 0 : Math.max(0, 30 - deduct);
  const bonus = Math.min(RULE.bonusCap, (rec.bonuses || []).reduce((s, b) => s + ((BONUS[b.kind] || {}).pts || 0), 0));
  const total = round1(Math.min(100, duties + behavior + surgery + bonus));
  const effMajors = majors + autoMajor + Math.floor(minors / 3);
  const committee = rec.committee || {};
  const holdLen = crit > 0 ? (committee.demote ? 0 : Math.max(RULE.criticalHold, +committee.holdMonths || RULE.criticalHold)) : effMajors > 0 ? 1 : 0;
  return { lk, duties: round1(duties), behavior, surgery: round1(surgery), bonus, total, minors, majors, crit, autoMajor, effMajors, holdLen, attachedPending, demote: crit > 0 && !!committee.demote, lowAttendance: low(rec) };
}

function checkUpgrade(res, L, i, cum, ym) {
  switch (L) {
    case 0: return groupSigned(res, 0, ym) ? { to: 1, reason: "Attached requirements signed off" } : null;
    case 1:
      if (cum >= RULE.j3Points && reqsThrough(res, 1, ym)) return { to: 2, reason: "500 points with requirements signed off" };
      if (i >= RULE.j3Cut) return { to: 2, reason: "Time cut at 6 months" };
      return null;
    case 2: {
      if (!examPassed(res, 1, ym)) return null;
      if (i >= RULE.msCut) return { to: 4, reason: "Time cut at 18 months, Exam 1 passed" };
      if (cum >= RULE.j2Points && reqsThrough(res, 2, ym)) return { to: 3, reason: "Early step: 1,500 points with Exam 1" };
      return null;
    }
    case 3: return i >= RULE.msCut ? { to: 4, reason: "Time cut at 18 months" } : null;
    case 4: {
      if (!examPassed(res, 2, ym)) return null;
      if (i >= RULE.srCut) return { to: 6, reason: "Time cut at 30 months, Exam 2 passed" };
      if (cum >= RULE.m1Points && reqsThrough(res, 4, ym)) return { to: 5, reason: "Early step: 2,500 points with Exam 2" };
      return null;
    }
    case 5: return i >= RULE.srCut ? { to: 6, reason: "Time cut at 30 months" } : null;
  }
  return null;
}

function run(res) {
  const now = ymNow();
  const b = res.baseline && validYM(res.baseline.month) ? res.baseline : null;
  const from = b ? b.month : res.start;
  let level = b ? (+b.level || 0) : 0;
  let cum = b ? (+b.points || 0) : 0;
  let holdEnd = -Infinity;
  const rows = [], history = [], majorIdx = [], critIdx = [];
  if (validYM(from)) {
    for (let ym = from; ym <= now; ym = ymAdd(ym, 1)) {
      const i = ymDiff(ym, res.start) + 1;
      const sc = scoreMonth(res, ym, level);
      if (sc) {
        cum += sc.total;
        if (sc.holdLen) holdEnd = Math.max(holdEnd, i + sc.holdLen - 1);
        if (sc.effMajors > 0) majorIdx.push(i);
        if (sc.crit > 0) critIdx.push(i);
      }
      const completed = ym < now;
      const onHold = holdEnd >= i;
      const row = { ym, i, level, sc, cum: round1(cum), onHold, completed, change: null, heldBack: false };
      if (completed) {
        if (sc && sc.demote && level > 0) row.change = { to: level - 1, reason: "Demoted one level by committee" };
        else {
          const up = checkUpgrade(res, level, i, cum, ym);
          if (up && !onHold) row.change = up;
          else if (up) row.heldBack = true;
        }
        if (row.change) { history.push({ ym, i, from: level, to: row.change.to, reason: row.change.reason }); level = row.change.to; }
      }
      rows.push(row);
    }
  }
  const i = validYM(res.start) ? ymDiff(now, res.start) + 1 : 0;
  const done = rows.filter(r => r.completed);
  const lastN = n => done.slice(-n);
  const avg = list => { const s = list.filter(r => r.sc); return s.length ? s.reduce((a, r) => a + r.sc.total, 0) / s.length : null; };
  const last3 = lastN(3), last6 = lastN(6), last12 = lastN(12);
  const avg3 = avg(last3), avg6 = avg(last6);
  const holdNow = holdEnd >= i;
  const boost = last3.length === 3 && last3.every(r => r.sc) && avg3 >= RULE.boostAvg && !last3.some(r => r.onHold) && !holdNow;
  const lastIdx = done.length ? done[done.length - 1].i : i - 1;
  const recentMajors = majorIdx.filter(x => x > lastIdx - 6);
  let twoMajors = false;
  for (let a = 0; a < majorIdx.length; a++) for (let c = a + 1; c < majorIdx.length; c++) if (majorIdx[c] - majorIdx[a] < 6 && majorIdx[c] > lastIdx - 6) twoMajors = true;
  const committee = critIdx.some(x => x > lastIdx - 6) || twoMajors;
  const lastRow = done[done.length - 1];
  const rewardExcluded = !!(lastRow && lastRow.sc && lastRow.sc.autoMajor);
  let tier = null;
  if (level === 6) {
    const stepB5 = ((res.surg || {}).B || {}).step >= 5;
    const hold6 = last6.some(r => r.onHold), hold12 = last12.some(r => r.onHold);
    tier = { avg6, hold6, hold12, stepB5, n: avg6 != null && avg6 >= RULE.srIII && !hold12 && stepB5 ? 3 : avg6 != null && avg6 >= RULE.srII && !hold6 ? 2 : 1 };
  }
  const unscored = done.filter(r => !r.sc).length;
  return { level, cum: round1(cum), i, rows, history, holdEnd, holdNow, avg3, avg6, boost, lastIdx, committee, twoMajors, recentMajors, rewardExcluded, tier, unscored };
}

function surgState(res, g, E) {
  const s = Object.assign({ step: 1, cases: 0, signoffs: [] }, (res.surg || {})[g]);
  const need = E.boost ? RULE.stepCasesBoost : RULE.stepCases;
  const consultants = new Set((s.signoffs || []).map(x => (x.by || "").trim().toLowerCase()).filter(Boolean));
  const locked = s.step >= 3 && E.level < GROUPS[g].opens; // step 4 opens at the group's level
  const canPromote = s.step < 5 && s.cases >= need && consultants.size >= 2 && !locked;
  const overdue = s.step < 4 && E.i > GROUPS[g].expected;
  return { ...s, need, consultants: consultants.size, locked, canPromote, overdue };
}

function nextStep(res, E) {
  const L = E.level, items = [];
  const cutYM = n => ymAdd(res.start, n - 1);
  let title, sub = "", early = null;
  const examItem = n => {
    const p = examPassed(res, n);
    if (p) return { state: "ok", text: `Exam ${n} passed${p.month ? " (" + ymLabel(p.month) + (p.score != null ? ", " + p.score + "/100" : "") + ")" : " before tracking"}` };
    return { state: "todo", text: `Exam ${n} not passed. Can sit from ${ymLabel(examEligibleFrom(res, n))}.` };
  };
  const reqItem = lvls => { const [s, t] = reqCount(res, lvls); return { state: s === t ? "ok" : "todo", text: `Requirements signed off: ${s} of ${t}` }; };
  const ptsItem = thr => ({ state: E.cum >= thr ? "ok" : "todo", text: `${fmt(E.cum)} of ${thr.toLocaleString("en-US")} points`, pct: Math.min(100, E.cum / thr * 100) });
  const pace = (thr, cut) => {
    if (E.cum >= thr || !E.avg3) return "";
    const reach = E.lastIdx + Math.ceil((thr - E.cum) / E.avg3);
    return reach < cut ? `At the recent average of ${fmt(E.avg3)}, they reach ${thr.toLocaleString("en-US")} points in month ${reach} (${ymLabel(cutYM(reach))}), ahead of the cut.` : `At the recent average of ${fmt(E.avg3)}, the ${cut}-month cut comes first.`;
  };
  if (L === 0) {
    title = "Next: 4-day junior";
    sub = "Moves up at the end of the first month in which the attached requirements are signed off.";
    items.push(reqItem([0]));
  } else if (L === 1) {
    title = "Next: 3-day junior";
    sub = `Automatically at the end of month ${RULE.j3Cut} (${ymLabel(cutYM(RULE.j3Cut))}). Earlier with 500 points and the requirements below signed off.`;
    items.push(ptsItem(RULE.j3Points), reqItem([0, 1]));
    const p = pace(RULE.j3Points, RULE.j3Cut); if (p) items.push({ state: "info", text: p });
  } else if (L === 2 || L === 3) {
    title = "Next: 2-day midsenior";
    sub = E.i > RULE.msCut && !examPassed(res, 1) ? "The 18-month cut has passed. They move up the month after passing Exam 1." : `At the end of month ${RULE.msCut} (${ymLabel(cutYM(RULE.msCut))}) with Exam 1 passed.`;
    items.push(examItem(1));
    if (L === 2 && E.i <= RULE.msCut) {
      early = { title: "Early step: 2-day junior", items: [ptsItem(RULE.j2Points), examItem(1), reqItem([0, 1, 2])] };
      const p = pace(RULE.j2Points, RULE.msCut); if (p) early.items.push({ state: "info", text: p });
    }
  } else if (L === 4 || L === 5) {
    title = "Next: Senior";
    sub = E.i > RULE.srCut && !examPassed(res, 2) ? "The 30-month cut has passed. They move up the month after passing Exam 2." : `At the end of month ${RULE.srCut} (${ymLabel(cutYM(RULE.srCut))}) with Exam 2 passed.`;
    items.push(examItem(2));
    if (L === 4 && E.i <= RULE.srCut) {
      early = { title: "Early step: 1-day midsenior", items: [ptsItem(RULE.m1Points), examItem(2), reqItem([0, 1, 2, 4])] };
      const p = pace(RULE.m1Points, RULE.srCut); if (p) early.items.push({ state: "info", text: p });
    }
  } else {
    const t = E.tier;
    title = `Senior ${["I", "II", "III"][t.n - 1]}`;
    sub = "Tiers follow the running 6-month average and are reviewed every 6 months. They can go down as well as up.";
    items.push({ state: t.avg6 >= RULE.srII ? "ok" : "todo", text: `6-month average: ${fmt(t.avg6)} (Senior II needs ${RULE.srII}, Senior III needs ${RULE.srIII})` });
    items.push({ state: t.hold6 ? "block" : "ok", text: t.hold6 ? "A hold in the last 6 months" : "No hold in the last 6 months" });
    items.push({ state: t.hold12 ? "todo" : "ok", text: t.hold12 ? "A hold in the last 12 months (blocks Senior III)" : "No hold in the last 12 months" });
    items.push({ state: t.stepB5 ? "ok" : "todo", text: t.stepB5 ? "Step 5 on Group B" : "Senior III needs step 5 on Group B" });
  }
  if (E.holdNow) items.unshift({ state: "block", text: `On hold through ${ymLabel(cutYM(E.holdEnd))}. No upgrade by points or by time until it ends.` });
  return { title, sub, items, early };
}

function shortNext(res, E) {
  if (!validYM(res.start)) return "";
  if (E.i < 1) return "Starts " + ymLabel(res.start);
  if (E.holdNow) return "On hold through " + ymLabel(ymAdd(res.start, E.holdEnd - 1));
  const L = E.level;
  if (L === 0) { const [s, t] = reqCount(res, [0]); return `Attached requirements ${s}/${t}`; }
  if (L === 1) return `3-day junior by ${ymLabel(ymAdd(res.start, RULE.j3Cut - 1))} (${fmt(E.cum)}/500 pts)`;
  if (L === 2 || L === 3) return examPassed(res, 1) ? `Midsenior after ${ymLabel(ymAdd(res.start, RULE.msCut - 1))}` : `Needs Exam 1 (from ${ymLabel(examEligibleFrom(res, 1))})`;
  if (L === 4 || L === 5) return examPassed(res, 2) ? `Senior after ${ymLabel(ymAdd(res.start, RULE.srCut - 1))}` : `Needs Exam 2 (from ${ymLabel(examEligibleFrom(res, 2))})`;
  return `Senior ${["I", "II", "III"][E.tier.n - 1]}`;
}

function statusChips(res, E) {
  const c = [];
  if (E.holdNow) c.push(`<span class="chip hold">On hold</span>`);
  if (E.committee) c.push(`<span class="chip hold">Committee review</span>`);
  if (E.unscored) c.push(`<span class="chip warn">${E.unscored} month${E.unscored > 1 ? "s" : ""} unscored</span>`);
  if (Object.keys(GROUPS).some(g => surgState(res, g, E).overdue)) c.push(`<span class="chip warn">Surgical remediation</span>`);
  if (E.rewardExcluded) c.push(`<span class="chip warn">No reward-pool cases</span>`);
  if (E.boost) c.push(`<span class="chip accent">Boost</span>`);
  return c.join("");
}

/* ---------- state & storage ---------- */
const S = { mode: "loading", db: null, canEdit: true, live: {}, residents: {}, demo: false, view: "roster", rid: null, tab: "progress", scoreYM: ymAdd(ymNow(), -1), q: "", modal: null };
let toastTimer;
function toast(msg) {
  let t = document.querySelector(".toast");
  if (!t) { t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}
const dbErr = e => e && e.code === "quota_exceeded" ? "The tracker is full. Delete residents you no longer need." : e && e.code === "invalid_argument" ? "You need edit access to change records." : "Could not save. Check your connection and try again.";
const writesLocal = () => S.demo || S.mode !== "live";
async function patchResident(id, patch, msg) {
  if (writesLocal()) { S.residents[id] = deepMerge(clone(S.residents[id]), patch); render(); if (msg) toast(msg); return true; }
  try { await S.db.doc("residents/" + id).update(patch); if (msg) toast(msg); return true; }
  catch (e) { toast(dbErr(e)); return false; }
}
async function createResident(obj) {
  if (writesLocal()) { const id = "r" + Math.random().toString(36).slice(2, 10); S.residents[id] = clone(obj); render(); return id; }
  try { const ref = S.db.collection("residents").doc(); await ref.set(obj); return ref.id; }
  catch (e) { toast(dbErr(e)); return null; }
}
async function deleteResident(id) {
  if (writesLocal()) { delete S.residents[id]; render(); return; }
  try { await S.db.doc("residents/" + id).delete(); } catch (e) { toast(dbErr(e)); }
}
function newResident(name, start, baseline) {
  return { name, start, baseline: baseline || null, reqs: {}, exams: { e1: [], e2: [] }, months: {}, surg: { A: { step: 1, cases: 0, signoffs: [] }, B: { step: 1, cases: 0, signoffs: [] }, C: { step: 1, cases: 0, signoffs: [] } }, notes: "", createdAt: new Date().toISOString() };
}

/* ---------- example residents (in memory only, from the doc's worked examples) ---------- */
function demoResidents() {
  const now = ymNow(), start = ymAdd(now, -21);
  const at = i => ymAdd(start, i - 1);
  const spec = [
    { name: "Resident A (example)", avg: 100, e1: [[14, 81]] },
    { name: "Resident B (example)", avg: 90, e1: [[16, 72]] },
    { name: "Resident C (example)", avg: 80, e1: [[17, 66]] },
    { name: "Resident D (example)", avg: 95, e1: [[14, 52], [21, 70]] },
    { name: "Resident E (example)", avg: 90, e1: [[16, 75]], major: 18 },
  ];
  const out = {};
  spec.forEach((s, n) => {
    const r = newResident(s.name, start, null);
    REQ_LEVELS.slice(0, 3).forEach((l, k) => REQS[LEVELS[l].key].forEach(q => { r.reqs[q.id] = { d1: at([1, 2, 7][k]) + "-08", d2: at([1, 4, 10][k]) + "-20" }; }));
    r.exams.e1 = s.e1.map(([i, sc]) => ({ month: at(i), score: sc }));
    for (let i = 1; i <= 21; i++) {
      const ym = at(i);
      const lk = LEVELS[run(r).rows.find(x => x.ym === ym).level].key;
      const rec = demoRec(lk, s.avg);
      if (s.major === i) rec.events.push({ tier: "major", date: ym + "-11", note: "Unreachable on call", by: "Night consultant" });
      r.months[ym] = rec;
    }
    r.surg.A = { step: s.avg >= 90 ? 4 : 3, cases: 5, signoffs: [{ by: "Consultant 1", date: at(19) + "-04" }] };
    r.surg.B = { step: 2, cases: 3, signoffs: [] };
    out["demo" + n] = r;
  });
  return out;
}
function demoRec(lk, target) {
  if (lk === "att") return { level: "att", misses: [], events: [], bonuses: [], assigned: 0, attended: 0 };
  const lines = DUTIES[lk], misses = lines.map(() => 0), as = SURG_MIN[lk];
  let att = as, gap = 100 - target;
  const per = 20 / as;
  while (gap >= per - 0.01 && (as - att + 1) <= as / 2) { att--; gap -= per; }
  lines.map((_, k) => k).sort((a, b) => lines[b][1] - lines[a][1]).forEach(k => { if (lines[k][1] / 2 <= gap + 0.01) { misses[k] = 1; gap -= lines[k][1] / 2; } });
  return { level: lk, misses, events: [], bonuses: [], assigned: as, attended: att };
}

/* ---------- rendering ---------- */
const app = document.getElementById("app");
const modalRoot = document.getElementById("modal");

function render() {
  const a = document.activeElement, fid = a && a.id, sel = a && a.selectionStart;
  app.innerHTML = topBar() + `<main class="wrap">${banner()}${view()}</main>`;
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch (e) {} } }
}
function topBar() {
  const nav = [["roster", "Residents"], ["scoring", "Monthly scoring"], ["rules", "Program rules"]];
  const cur = S.view === "resident" ? "roster" : S.view;
  const chip = S.demo ? `<span class="modechip demo"><span class="dot"></span>Examples</span>` : S.mode === "live" ? `<span class="modechip live"><span class="dot"></span>Shared${S.canEdit ? "" : " · view only"}</span>` : S.mode === "loading" ? `<span class="modechip"><span class="dot"></span>Connecting</span>` : `<span class="modechip"><span class="dot"></span>Not saved</span>`;
  return `<header class="top"><div class="wrap top-in">
    <div class="brand">${logo()}<div><div class="b1">Neurosurgery Residency</div><div class="b2">Progression tracker</div></div></div>
    <nav aria-label="Sections">${nav.map(([k, l]) => `<button class="navbtn" data-act="nav" data-v="${k}" ${cur === k ? 'aria-current="page"' : ""}>${l}</button>`).join("")}</nav>
    ${chip}
  </div></header>`;
}
function logo() {
  // seven rungs, one per duty level
  const bars = LEVELS.map((_, i) => `<rect x="${2 + i * 4.3}" y="${26 - (i + 1) * 3.2}" width="3.2" height="${(i + 1) * 3.2}" rx="1" fill="var(--l${i})"/>`).join("");
  return `<svg width="34" height="28" viewBox="0 0 34 28" aria-hidden="true">${bars}</svg>`;
}
function banner() {
  if (S.demo) return `<div class="banner">You are looking at example residents built from the doc's worked examples. Nothing here is saved. <button class="btn sm" data-act="demo-off">Back to the department</button></div>`;
  if (S.mode === "offline") return `<div class="banner">This copy is not connected to the shared tracker, so changes stay in this browser tab and are lost when it closes. Open the tracker from its claude.ai link to save records.</div>`;
  return "";
}
function view() {
  if (S.view === "resident" && S.residents[S.rid]) return residentView();
  if (S.view === "scoring") return scoringView();
  if (S.view === "rules") return rulesView();
  return rosterView();
}

function sortedIds() {
  return Object.keys(S.residents).sort((a, b) => {
    const ra = S.residents[a], rb = S.residents[b];
    const la = run(ra).level, lb = run(rb).level;
    return lb - la || String(ra.name).localeCompare(String(rb.name));
  });
}

function rosterView() {
  const ids = sortedIds();
  const can = S.canEdit;
  const actions = can ? `<button class="btn" data-act="import">Import a list</button><button class="btn primary" data-act="add">Add resident</button>` : "";
  if (S.mode === "loading") return `<div class="head"><h1>Residents</h1></div><div class="card empty"><p class="muted">Loading the department's residents…</p></div>`;
  if (!ids.length) {
    return `<div class="head"><h1>Residents</h1><div class="actions">${actions}</div></div>
    <div class="card empty">
      <h2>Add the department's residents</h2>
      <p class="muted">Start with the people already in the program. For each one, enter when they started and the level they hold now, and the tracker takes it from there: monthly scores, requirements, exams, holds and the surgical ladder. You can add them one at a time or paste the whole list.</p>
      ${can ? `<div class="row"><button class="btn primary" data-act="add">Add resident</button><button class="btn" data-act="import">Import a list</button></div>` : `<p class="muted">You have view access. Ask the program director for edit access to add residents.</p>`}
      ${S.demo ? "" : `<p class="small muted">Want to see it working first? <button class="linkbtn" data-act="demo-on">Look at example residents</button>. They are not saved.</p>`}
    </div>`;
  }
  const engines = Object.fromEntries(ids.map(id => [id, run(S.residents[id])]));
  const counts = LEVELS.map((_, i) => ids.filter(id => engines[id].level === i).length);
  const max = Math.max(1, ...counts);
  const lastYM = ymAdd(ymNow(), -1);
  const tracked = ids.filter(id => engines[id].rows.some(r => r.ym === lastYM));
  const scored = tracked.filter(id => (S.residents[id].months || {})[lastYM]);
  const ql = S.q.trim().toLowerCase();
  const shown = ids.filter(id => !ql || String(S.residents[id].name).toLowerCase().includes(ql));
  const holds = ids.filter(id => engines[id].holdNow).length;
  return `<div class="head"><div><h1>Residents</h1><p class="muted">${ids.length} in the program${holds ? ` · ${holds} on hold` : ""}</p></div><div class="actions">${actions}</div></div>
  <div class="grid2">
    <div class="card stack">
      <div class="label">Department mix by duty level</div>
      <div class="mix">${counts.map((n, i) => `<div class="mixcol"><div class="mixn">${n}</div><div class="mixbar l${i}" style="height:${6 + n / max * 72}px"></div><div class="mixlab">${esc(LEVELS[i].name)}</div></div>`).join("")}</div>
      <div class="mixgroups"><div>Juniors ${counts.slice(0, 4).reduce((a, b) => a + b, 0)}</div><div>Midseniors ${counts[4] + counts[5]}</div><div>Seniors ${counts[6]}</div></div>
    </div>
    <div class="card stack">
      <div class="label">Scoring for ${ymLabel(lastYM)}</div>
      <div class="row"><span class="num" style="font-size:28px;font-weight:600">${scored.length}<span class="muted" style="font-size:16px"> / ${tracked.length}</span></span><span class="muted">residents scored</span></div>
      <div class="progress"><span style="width:${tracked.length ? scored.length / tracked.length * 100 : 0}%"></span></div>
      <p class="small muted">Totals are checked at the end of each month and upgrades take effect on the 1st. Score last month so this month's levels are right.</p>
      <div><button class="btn" data-act="nav" data-v="scoring">Open monthly scoring</button></div>
    </div>
  </div>
  <div class="row"><input class="search" id="q" type="search" placeholder="Find a resident" value="${esc(S.q)}" aria-label="Find a resident"></div>
  <div class="tablewrap"><table>
    <thead><tr><th>Resident</th><th>Level</th><th class="r">Month</th><th class="r">Points</th><th>Exams</th><th>Next</th><th>Status</th></tr></thead>
    <tbody>${shown.map(id => { const r = S.residents[id], E = engines[id]; const e1 = examPassed(r, 1), e2 = examPassed(r, 2);
      return `<tr class="click" data-act="open" data-id="${id}" tabindex="0">
        <td class="rname">${esc(r.name)}</td><td>${pillName(E.level)}</td>
        <td class="r num">${E.i >= 1 ? E.i : "–"}</td><td class="r num">${fmt(E.cum)}</td>
        <td><div class="chips"><span class="chip ${e1 ? "ok" : ""}">E1 ${e1 ? "passed" : "–"}</span><span class="chip ${e2 ? "ok" : ""}">E2 ${e2 ? "passed" : "–"}</span></div></td>
        <td class="nextcell">${esc(shortNext(r, E))}</td><td><div class="chips">${statusChips(r, E)}</div></td></tr>`; }).join("") || `<tr><td colspan="7" class="muted">No resident matches "${esc(S.q)}".</td></tr>`}</tbody>
  </table></div>`;
}

function residentView() {
  const res = S.residents[S.rid], E = run(res);
  const tabs = [["progress", "Progress"], ["scores", "Monthly scores"], ["reqs", "Requirements"], ["exams", "Exams"], ["surgery", "Surgical ladder"], ["profile", "Profile"]];
  const body = { progress: tabProgress, scores: tabScores, reqs: tabReqs, exams: tabExams, surgery: tabSurgery, profile: tabProfile }[S.tab] || tabProgress;
  return `<div class="rhead">
    <button class="btn ghost back" data-act="nav" data-v="roster">← All residents</button>
    <div class="rtitle"><h1>${esc(res.name)}</h1>${pillName(E.level)}<div class="chips">${statusChips(res, E)}</div></div>
    <div class="facts">
      <div class="fact"><div class="label">Month in program</div><div class="v">${E.i >= 1 ? E.i : "–"}</div></div>
      <div class="fact"><div class="label">Started</div><div class="v" style="font-size:16px">${ymLabel(res.start)}</div></div>
      <div class="fact"><div class="label">Total points</div><div class="v">${fmt(E.cum)}</div></div>
      <div class="fact"><div class="label">3-month average</div><div class="v">${fmt(E.avg3)}</div></div>
      <div class="fact"><div class="label">On call</div><div class="v" style="font-size:16px">${esc(LEVELS[E.level].calls)}</div></div>
    </div>
  </div>
  <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button class="tab" role="tab" data-act="tab" data-v="${k}" aria-selected="${S.tab === k}">${l}</button>`).join("")}</div>
  ${body(res, E)}`;
}

function checkList(items) {
  return `<ul class="checks">${items.map(it => `<li><span class="tick ${it.state === "info" ? "" : it.state}">${it.state === "ok" ? "✓" : it.state === "block" ? "!" : it.state === "info" ? "" : ""}</span><div class="stack" style="gap:4px"><span class="${it.state === "info" ? "muted small" : ""}">${esc(it.text)}</span>${it.pct != null ? `<div class="progress"><span style="width:${it.pct}%"></span></div>` : ""}</div></li>`).join("")}</ul>`;
}

function tabProgress(res, E) {
  const ns = nextStep(res, E);
  const reached = {}; E.history.forEach(h => { reached[h.to] = h; });
  const startLvl = res.baseline ? +res.baseline.level : 0;
  const cut = { 2: RULE.j3Cut, 4: RULE.msCut, 6: RULE.srCut };
  const ladder = LEVELS.map((l, i) => {
    let when;
    if (reached[i]) when = `<span class="small">End of month ${reached[i].i} · ${esc(reached[i].reason)}</span>`;
    else if (i === startLvl && i <= E.level) when = `<span class="small muted">${res.baseline ? "Level when tracking began, " + ymLabel(res.baseline.month) : "Day one"}</span>`;
    else if (i < E.level) when = `<span class="small muted">Before tracking</span>`;
    else if (cut[i]) when = `<span class="small muted">Time cut: end of month ${cut[i]} (${ymLabel(ymAdd(res.start, cut[i] - 1))})</span>`;
    else when = `<span class="small muted">${i === 3 || i === 5 ? "Early step only" : i === 1 ? "End of month 1 at the earliest" : ""}</span>`;
    return `<div class="rung ${i === E.level ? "now" : i > E.level ? "future" : ""}">${pill(i)}<div><div class="rname">${esc(l.name)}</div>${when}</div><span class="small muted">${esc(l.calls)}</span></div>`;
  }).reverse().join("");
  const flags = [];
  if (E.committee) flags.push(`<div class="note hold">${E.twoMajors ? "Two major events within 6 months." : "A critical event in the last 6 months."} This goes to committee review (program director and two consultants).</div>`);
  if (E.rewardExcluded) flags.push(`<div class="note warn">Missed more than half of the assigned cases two months running. That counts as a major event, and they get no places from the reward pool this month.</div>`);
  if (E.boost) flags.push(`<div class="note">Averaging ${fmt(E.avg3)} over the last 3 months with no hold: first pick from the reward pool, assessment after ${RULE.stepCasesBoost} logged cases instead of ${RULE.stepCases}, and access to the next procedure group one level early, up to step 3.</div>`);
  if (E.unscored) flags.push(`<div class="note warn">${E.unscored} completed month${E.unscored > 1 ? "s have" : " has"} no score. Unscored months add no points. <button class="linkbtn" data-act="tab" data-v="scores">Score them</button></div>`);
  return `<div class="grid2">
    <div class="card stack">
      <h2>${esc(ns.title)}</h2><p class="muted">${esc(ns.sub)}</p>${checkList(ns.items)}
      ${ns.early ? `<div class="stack" style="margin-top:6px;padding-top:12px;border-top:1px solid var(--line)"><h3>${esc(ns.early.title)}</h3><p class="small muted">Reduces on-call days without changing rank.</p>${checkList(ns.early.items)}</div>` : ""}
    </div>
    <div class="card stack"><h2>Level ladder</h2><div class="ladder">${ladder}</div></div>
  </div>${flags.length ? `<div class="stack">${flags.join("")}</div>` : ""}`;
}

function tabScores(res, E) {
  const rows = E.rows.slice().reverse();
  if (!rows.length) return `<div class="card"><p class="muted">Tracking starts ${ymLabel(res.baseline ? res.baseline.month : res.start)}.</p></div>`;
  return `<p class="muted small">A perfect month is 100: duties 50, behavior 30, surgery 20, with bonuses offsetting deductions up to 100. ${S.canEdit ? "Select a month to score it." : ""}</p>
  <div class="tablewrap"><table>
  <thead><tr><th>Month</th><th class="r">#</th><th>Level</th><th class="r">Duties</th><th class="r">Behavior</th><th class="r">Surgery</th><th class="r">Bonus</th><th class="r">Total</th><th class="r">Running</th><th>Notes</th></tr></thead>
  <tbody>${rows.map(r => { const s = r.sc; const notes = [];
    if (!r.completed) notes.push(`<span class="chip">In progress</span>`);
    if (r.change) notes.push(`<span class="chip ok">→ ${LEVELS[r.change.to].code} ${esc(r.change.reason)}</span>`);
    if (r.heldBack) notes.push(`<span class="chip hold">Upgrade held</span>`);
    else if (r.onHold) notes.push(`<span class="chip hold">Hold</span>`);
    if (s && s.crit) notes.push(`<span class="chip hold">Critical event</span>`);
    if (s && s.autoMajor) notes.push(`<span class="chip warn">Low attendance, 2nd month</span>`);
    if (s && s.attachedPending) notes.push(`<span class="chip warn">70 pts wait on sign-off</span>`);
    if (!s && r.completed) notes.push(`<span class="chip warn">Not scored</span>`);
    return `<tr class="${S.canEdit ? "click" : ""}" ${S.canEdit ? `data-act="score" data-id="${S.rid}" data-ym="${r.ym}" tabindex="0"` : ""}>
      <td>${ymLabel(r.ym)}</td><td class="r num">${r.i}</td><td>${pill(s ? LVL[s.lk] : r.level)}</td>
      <td class="r num">${s ? fmt(s.duties) : "–"}</td><td class="r num">${s ? fmt(s.behavior) : "–"}</td><td class="r num">${s ? fmt(s.surgery) : "–"}</td><td class="r num">${s && s.bonus ? "+" + s.bonus : "–"}</td>
      <td class="r num"><strong>${s ? fmt(s.total) : "–"}</strong></td><td class="r num">${fmt(r.cum)}</td><td><div class="chips">${notes.join("")}</div></td></tr>`; }).join("")}
  </tbody></table></div>`;
}

function tabReqs(res) {
  const dis = S.canEdit ? "" : "disabled";
  const pr = res.baseline && res.baseline.priorReqs ? +res.baseline.level : -1;
  return `<p class="muted small">A requirement is signed off when the training coordinator has recorded the resident doing it correctly and unaided on two separate occasions. Unsigned requirements block only an upgrade ahead of the time cut, except in the attached month.</p>
  ${REQ_LEVELS.map(l => { const list = REQS[LEVELS[l].key]; const [s, t] = reqCount(res, [l]);
    const prior = l < pr;
    return `<div class="card stack"><div class="row"><h2>${pillName(l)}</h2><span class="chip ${s === t ? "ok" : ""}" style="margin-left:auto">${s} of ${t} signed off</span></div>
    ${prior ? `<p class="small muted">Counted as signed off: they held a higher level when tracking began.</p>` : ""}
    <div>${list.map(r => { const v = (res.reqs || {})[r.id] || {}; const ok = reqSigned(res, r.id);
      return `<div class="reqrow"><span class="tick ${ok ? "ok" : "todo"}">${ok ? "✓" : ""}</span><span>${esc(r.text)}</span>
      ${prior ? "" : `<div class="reqdates"><label>Occasion 1<input type="date" id="rq-${r.id}-d1" data-act-change="req" data-req="${r.id}" data-slot="d1" value="${esc(v.d1 || "")}" ${dis}></label><label>Occasion 2<input type="date" id="rq-${r.id}-d2" data-act-change="req" data-req="${r.id}" data-slot="d2" value="${esc(v.d2 || "")}" ${dis}></label></div>`}</div>`; }).join("")}</div></div>`; }).join("")}`;
}

function tabExams(res) {
  const card = n => {
    const list = attempts(res, n).slice().sort((a, b) => a.month < b.month ? -1 : 1);
    const p = examPassed(res, n);
    const what = n === 1 ? "The neurological examination. Gates midsenior." : "Neurosurgery principles, especially trauma and emergencies. Gates senior.";
    return `<div class="card stack"><div class="row"><h2>Exam ${n}</h2>${p ? `<span class="chip ok" style="margin-left:auto">Passed</span>` : `<span class="chip" style="margin-left:auto">Not passed</span>`}</div>
      <p class="muted small">${what} Marked out of 100, pass mark ${RULE.passMark}. Can be taken after month ${n === 1 ? RULE.exam1After : RULE.exam2After}; a failed exam can be retaken after ${RULE.retakeAfter} months.</p>
      ${res.baseline && res.baseline["exam" + n] ? `<p>Passed before tracking began.</p>` : ""}
      ${list.length ? `<div class="tablewrap"><table><thead><tr><th>Month</th><th class="r">Score</th><th>Result</th>${S.canEdit ? "<th></th>" : ""}</tr></thead><tbody>${list.map(a => `<tr><td>${ymLabel(a.month)}</td><td class="r num">${a.score != null ? a.score : "–"}</td><td>${passedAttempt(a) ? `<span class="chip ok">Pass</span>` : `<span class="chip hold">Fail</span>`}</td>${S.canEdit ? `<td class="r"><button class="btn ghost sm" data-act="exam-del" data-n="${n}" data-ym="${a.month}" data-score="${a.score}">Remove</button></td>` : ""}</tr>`).join("")}</tbody></table></div>` : `<p class="muted">No attempts recorded.</p>`}
      ${!p ? `<p class="small">Can sit from <strong>${ymLabel(examEligibleFrom(res, n))}</strong>.</p>` : ""}
      ${S.canEdit ? `<div><button class="btn" data-act="exam-add" data-n="${n}">Record an attempt</button></div>` : ""}</div>`;
  };
  return `<div class="grid2">${card(1)}${card(2)}</div>`;
}

function tabSurgery(res, E) {
  const can = S.canEdit;
  return `<p class="muted small">Each procedure group is climbed separately. Moving up one step needs ${RULE.stepCases} logged cases at the current step (${RULE.stepCasesBoost} with the boost) and sign-off from two different consultants. Points never buy autonomy; only consultant sign-off does.</p>
  <div class="grid3">${Object.keys(GROUPS).map(g => { const G = GROUPS[g], s = surgState(res, g, E);
    return `<div class="card stack">
      <div class="row"><h2>Group ${g}</h2><span class="chip ${s.step >= 4 ? "ok" : ""}" style="margin-left:auto">Step ${s.step} of 5</span></div>
      <p class="small muted">${esc(G.examples)}</p>
      <div class="steps" aria-label="Step ${s.step} of 5">${STEPS.map((_, k) => `<span class="step ${k < s.step ? "on" : k >= 3 && E.level < G.opens ? "lock" : ""}"></span>`).join("")}</div>
      <div><strong>${esc(STEPS[s.step - 1])}</strong>${s.step < 5 ? `<div class="small muted">Next: ${esc(STEPS[s.step])}</div>` : ""}</div>
      ${s.step < 5 ? `<ul class="checks">
        <li><span class="tick ${s.cases >= s.need ? "ok" : "todo"}">${s.cases >= s.need ? "✓" : ""}</span><span>${s.cases} of ${s.need} cases logged at this step</span></li>
        <li><span class="tick ${s.consultants >= 2 ? "ok" : "todo"}">${s.consultants >= 2 ? "✓" : ""}</span><span>${s.consultants} of 2 consultants signed off${(s.signoffs || []).length ? ": " + s.signoffs.map(x => esc(x.by)).join(", ") : ""}</span></li>
        ${s.step >= 3 ? `<li><span class="tick ${s.locked ? "block" : "ok"}">${s.locked ? "!" : "✓"}</span><span>Step 4 opens at ${G.opensName.toLowerCase()} level</span></li>` : ""}
      </ul>` : ""}
      ${s.overdue ? `<div class="note warn">Step 4 was expected by month ${G.expected}. Set up a remediation plan with assigned cases and a named consultant.</div>` : `<p class="small muted">Step 4 expected by month ${G.expected} (${ymLabel(ymAdd(res.start, G.expected - 1))}).</p>`}
      ${can ? `<div class="row">
        ${s.step < 5 ? `<button class="btn sm" data-act="case" data-g="${g}" data-d="1">+ Log case</button><button class="btn sm" data-act="case" data-g="${g}" data-d="-1" ${s.cases ? "" : "disabled"}>−</button><button class="btn sm" data-act="signoff" data-g="${g}">Add sign-off</button>` : ""}
        <button class="btn ghost sm" data-act="surg-edit" data-g="${g}">Correct</button>
      </div>
      ${s.step < 5 ? `<div><button class="btn primary sm" data-act="promote" data-g="${g}" ${s.canPromote ? "" : "disabled"}>Move up to step ${s.step + 1}</button></div>` : ""}` : ""}
    </div>`; }).join("")}</div>`;
}

function tabProfile(res, E) {
  const b = res.baseline;
  return `<div class="grid2"><div class="card stack">
    <h2>Profile</h2>
    <div class="fields">
      <div><div class="label">Name</div><div>${esc(res.name)}</div></div>
      <div><div class="label">Program start</div><div>${ymLabel(res.start)}</div></div>
      <div><div class="label">Tracking began</div><div>${b ? ymLabel(b.month) + " as " + esc(LEVELS[+b.level].name) : "Day one"}</div></div>
      <div><div class="label">Points carried in</div><div class="num">${b ? fmt(+b.points || 0) : "0"}</div></div>
    </div>
    ${res.notes ? `<div><div class="label">Notes</div><p style="white-space:pre-wrap">${esc(res.notes)}</p></div>` : ""}
    ${S.canEdit ? `<div class="row"><button class="btn" data-act="edit">Edit profile</button><button class="btn danger" data-act="delete">Delete resident</button></div>` : ""}
  </div>
  <div class="card stack"><h2>Upgrade history</h2>
    ${E.history.length ? `<ul class="checks">${E.history.map(h => `<li><span class="tick ok">✓</span><span>${pill(h.to)} ${esc(LEVELS[h.to].name)} from ${ymLabel(ymAdd(h.ym, 1))}<br><span class="small muted">End of month ${h.i}: ${esc(h.reason)}</span></span></li>`).join("")}</ul>` : `<p class="muted">No upgrades since tracking began.</p>`}
  </div></div>`;
}

function scoringView() {
  const ym = S.scoreYM, ids = sortedIds();
  const nowYM = ymNow();
  const rows = ids.map(id => { const r = S.residents[id], E = run(r); return { id, r, row: E.rows.find(x => x.ym === ym) }; });
  const tracked = rows.filter(x => x.row), done = tracked.filter(x => x.row.sc);
  return `<div class="head"><div><h1>Monthly scoring</h1><p class="muted">Score each resident from the coordinator's recorded misses, behavior events and the countersigned logbook.</p></div></div>
  <div class="row">
    <button class="btn sm" data-act="ym" data-d="-1" aria-label="Previous month">←</button>
    <h2 style="min-width:120px;text-align:center">${ymLabel(ym)}</h2>
    <button class="btn sm" data-act="ym" data-d="1" aria-label="Next month" ${ym >= nowYM ? "disabled" : ""}>→</button>
    <span class="chip ${done.length === tracked.length && tracked.length ? "ok" : "warn"}">${done.length} of ${tracked.length} scored</span>
    ${ym === nowYM ? `<span class="chip">Month in progress</span>` : ""}
  </div>
  ${!ids.length ? `<div class="card empty"><p class="muted">Add residents first, then score them here each month.</p>${S.canEdit ? `<div><button class="btn primary" data-act="add">Add resident</button></div>` : ""}</div>` :
  `<div class="tablewrap"><table><thead><tr><th>Resident</th><th>Level that month</th><th class="r">Duties</th><th class="r">Behavior</th><th class="r">Surgery</th><th class="r">Total</th><th>Status</th><th></th></tr></thead>
  <tbody>${rows.map(({ id, r, row }) => {
    if (!row) return `<tr><td class="rname">${esc(r.name)}</td><td colspan="6" class="muted">Not tracked this month</td><td></td></tr>`;
    const s = row.sc;

function scoreSummary(row) {
  const s = row && row.sc;
  if (!s) return "";
  const eff = [];
  if (s.crit) eff.push(s.demote ? "Critical event: demotion by one level at month end." : `Critical event: ${s.holdLen}-month hold, committee review.`);
  else if (s.effMajors) eff.push(`Major event${s.autoMajor ? " (low surgical attendance, second month running)" : s.minors >= 3 && !s.majors ? " (three minors)" : ""}: 1-month hold.`);
  if (row.change) eff.push(`At month end: moves to ${LEVELS[row.change.to].name} (${row.change.reason}).`);
  else if (row.heldBack) eff.push("An upgrade is due but the hold blocks it.");
  return `<div class="summary"><span>Duties <strong class="num">${fmt(s.duties)}</strong>/50</span><span>Behavior <strong class="num">${fmt(s.behavior)}</strong>/30</span><span>Surgery <strong class="num">${fmt(s.surgery)}</strong>/20</span>${s.bonus ? `<span>Bonus <strong class="num">+${s.bonus}</strong></span>` : ""}<span class="tot">${fmt(s.total)}</span></div>${eff.length ? `<div class="note ${s.crit || s.effMajors ? "hold" : ""}" style="margin-top:8px">${eff.map(esc).join("<br>")}</div>` : ""}`;
}

}

async function saveAdd() {

function parseLevel(s) {
  const k = String(s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
  const map = { attached: 0, att: 0, "4dayjunior": 1, "4day": 1, j4: 1, "3dayjunior": 2, "3day": 2, j3: 2, "2dayjunior": 3, j2: 3, "2daymidsenior": 4, "2daymid": 4, ms2: 4, m2: 4, midsenior: 4, "1daymidsenior": 5, "1daymid": 5, ms1: 5, m1: 5, senior: 6, sr: 6 };
  return k in map ? map[k] : null;
}
function parseYM(s) {
  s = String(s || "").trim();
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})$/); if (m) return m[1] + "-" + m[2].padStart(2, "0");
  m = s.match(/^(\d{1,2})[-\/.](\d{4})$/); if (m) return m[2] + "-" + m[1].padStart(2, "0");
  m = s.match(/^([a-z]{3})[a-z]*\.?\s+(\d{4})$/i); if (m) { const k = MONTHS.findIndex(x => x.toLowerCase() === m[1].toLowerCase()); if (k >= 0) return m[2] + "-" + String(k + 1).padStart(2, "0"); }
  return null;
}
function parseImport(text) {
  return String(text || "").split(/\n/).map(l => l.trim()).filter(Boolean).map(line => {
    const p = line.split(/\t|,|;/).map(x => x.trim());
    const out = { name: p[0], start: parseYM(p[1]), level: p[2] ? parseLevel(p[2]) : null, points: p[3] ? +p[3] : 0, err: "" };
    if (!out.name) out.err = "Missing name";
    else if (!out.start || !validYM(out.start)) out.err = "Start month not recognised";
    else if (p[2] && out.level == null) out.err = "Level not recognised";
    else if (out.level == null && out.start < ymNow()) out.err = "Add their current level";
    else if (isNaN(out.points)) out.err = "Points must be a number";
    return out;
  });
}

}
function signoffModal() {
  const d = S.modal.draft;
  return `<div class="mhead"><h2>Group ${S.modal.g}: consultant sign-off</h2><p class="small muted">On an assessed case at step ${d.step}. Two different consultants are needed to move up.</p></div>
  <div class="mbody"><div class="fields"><label class="field"><span>Consultant</span><input type="text" id="so-by" data-m="by" value="${esc(d.by)}"></label><label class="field"><span>Date</span><input type="date" id="so-date" data-m="date" value="${esc(d.date)}"></label></div>
  <p id="so-err" class="small" style="color:var(--hold)" ${S.modal.err ? "" : "hidden"}>${esc(S.modal.err || "")}</p></div>
  <div class="mfoot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="so-save">Add sign-off</button></div>`;
}
function surgEditModal() {
  const d = S.modal.draft;
  return `<div class="mhead"><h2>Group ${S.modal.g}: correct the record</h2><p class="small muted">Use this to enter where an existing resident already stands. Changing the step clears the sign-offs at the old step.</p></div>
  <div class="mbody"><div class="fields"><label class="field"><span>Step</span><select id="se-step" data-m="step">${STEPS.map((s, k) => `<option value="${k + 1}" ${+d.step === k + 1 ? "selected" : ""}>${k + 1}. ${esc(s)}</option>`).join("")}</select></label>
  <label class="field"><span>Cases logged at this step</span><input type="number" min="0" id="se-cases" data-m="cases" value="${esc(d.cases)}"></label></div></div>
  <div class="mfoot"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="se-save">Save</button></div>`;
}
function deleteModal() {
  const r = S.residents[S.modal.rid];
  return `<div class="mhead"><h2>Delete ${esc(r.name)}?</h2></div><div class="mbody"><p>This removes their profile, every monthly score, requirement sign-off, exam and surgical record. It cannot be undone.</p></div>
  <div class="mfoot"><button class="btn" data-act="close">Keep resident</button><button class="btn danger" data-act="del-confirm">Delete resident</button></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "scrim") { if (e.target === el) closeModal(); return; }
  const m = S.modal;
  switch (act) {
    case "nav": S.view = el.dataset.v; S.modal = null; window.scrollTo(0, 0); render(); break;
    case "open": S.view = "resident"; S.rid = el.dataset.id; S.tab = "progress"; window.scrollTo(0, 0); render(); break;
    case "tab": S.tab = el.dataset.v; render(); break;
    case "ym": { const n = ymAdd(S.scoreYM, +el.dataset.d); if (n <= ymNow()) { S.scoreYM = n; render(); } break; }
    case "demo-on": S.demo = true; S.residents = demoResidents(); S.view = "roster"; render(); break;
    case "demo-off": S.demo = false; S.residents = S.live; S.view = "roster"; render(); break;
    case "add": openAdd(); break;
    case "edit": openAdd(S.rid); break;
    case "import": openModal({ type: "import", draft: { text: "" } }); break;
    case "delete": openModal({ type: "delete", rid: S.rid }); break;
    case "del-confirm": { const id = m.rid, name = S.residents[id].name; closeModal(); S.view = "roster"; await deleteResident(id); render(); toast(name + " deleted"); break; }
    case "close": closeModal(); break;
    case "score": openScore(el.dataset.id, el.dataset.ym); break;
    case "sc-miss": m.draft.misses[+el.dataset.k] = +el.dataset.v; renderModal(); break;
    case "sc-relevel": { const lk = LEVELS[+el.dataset.v].key; m.draft.level = lk; m.draft.misses = lk === "att" ? [] : DUTIES[lk].map(() => 0); if (lk !== "att") { m.draft.assigned = m.draft.assigned || SURG_MIN[lk]; } renderModal(); break; }
    case "sc-ev-add": m.draft.events.push({ tier: el.dataset.v, date: defaultDate(m.ym), note: "", by: "" }); renderModal(); break;
    case "sc-ev-del": m.draft.events.splice(+el.dataset.k, 1); renderModal(); break;
    case "sc-bn-add": m.draft.bonuses.push({ kind: el.dataset.v, date: defaultDate(m.ym), note: "" }); renderModal(); break;
    case "sc-bn-del": m.draft.bonuses.splice(+el.dataset.k, 1); renderModal(); break;
    case "sc-save": {
      const d = clone(m.draft);
      d.assigned = Math.max(0, +d.assigned || 0); d.attended = Math.max(0, Math.min(+d.attended || 0, d.assigned));
      if (!d.events.some(x => x.tier === "critical")) d.committee = null;
      else d.committee = { holdMonths: Math.max(3, +((d.committee || {}).holdMonths) || 3), demote: !!(d.committee || {}).demote };
      d.savedAt = new Date().toISOString();
      if (await patchResident(m.rid, { months: { [m.ym]: d } }, "Month saved")) closeModal();
      break;
    }
    case "sc-clear": {
      const res = clone(S.residents[m.rid]); delete res.months[m.ym];
      if (writesLocal()) { S.residents[m.rid] = res; render(); }
      else { try { await S.db.doc("residents/" + m.rid).set(res); } catch (err) { toast(dbErr(err)); break; } }
      closeModal(); toast("Month cleared"); break;
    }
    case "ar-save": saveAdd(); break;
    case "imp-save": saveImport(); break;
    case "exam-add": openModal({ type: "exam", n: +el.dataset.n, draft: { month: ymAdd(ymNow(), -1), score: "" } }); break;
    case "ex-save": {
      const d = m.draft, sc = d.score === "" ? NaN : +d.score;
      if (isNaN(sc) || sc < 0 || sc > 100) { m.err = "Enter a score between 0 and 100."; renderModal(); break; }
      const list = attempts(S.residents[S.rid], m.n).concat([{ month: d.month, score: sc }]);
      if (await patchResident(S.rid, { exams: { ["e" + m.n]: list } }, sc >= RULE.passMark ? `Exam ${m.n} passed` : "Attempt recorded")) closeModal();
      break;
    }
    case "exam-del": {
      const n = +el.dataset.n, list = attempts(S.residents[S.rid], n).slice();
      const k = list.findIndex(a => a.month === el.dataset.ym && String(a.score) === el.dataset.score);
      if (k >= 0) { list.splice(k, 1); patchResident(S.rid, { exams: { ["e" + n]: list } }, "Attempt removed"); }
      break;
    }
    case "case": { const g = el.dataset.g, s = surgState(S.residents[S.rid], g, run(S.residents[S.rid])); patchResident(S.rid, { surg: { [g]: { step: s.step, cases: Math.max(0, s.cases + +el.dataset.d), signoffs: s.signoffs || [] } } }); break; }
    case "signoff": { const g = el.dataset.g, s = surgState(S.residents[S.rid], g, run(S.residents[S.rid])); openModal({ type: "signoff", g, draft: { by: "", date: todayISO(), step: s.step } }); break; }
    case "so-save": {
      const d = m.draft; if (!(d.by || "").trim()) { m.err = "Enter the consultant's name."; renderModal(); break; }
      const s = surgState(S.residents[S.rid], m.g, run(S.residents[S.rid]));
      if (await patchResident(S.rid, { surg: { [m.g]: { step: s.step, cases: s.cases, signoffs: (s.signoffs || []).concat([{ by: d.by.trim(), date: d.date }]) } } }, "Sign-off added")) closeModal();
      break;
    }
    case "promote": { const g = el.dataset.g, s = surgState(S.residents[S.rid], g, run(S.residents[S.rid])); if (s.canPromote) patchResident(S.rid, { surg: { [g]: { step: s.step + 1, cases: 0, signoffs: [] } } }, `Group ${g}: step ${s.step + 1}`); break; }
    case "surg-edit": { const g = el.dataset.g, s = surgState(S.residents[S.rid], g, run(S.residents[S.rid])); openModal({ type: "surg-edit", g, draft: { step: s.step, cases: s.cases, oldStep: s.step, signoffs: s.signoffs } }); break; }
    case "se-save": {
      const d = m.draft, step = Math.min(5, Math.max(1, +d.step || 1));
      if (await patchResident(S.rid, { surg: { [m.g]: { step, cases: Math.max(0, +d.cases || 0), signoffs: step === d.oldStep ? (d.signoffs || []) : [] } } }, "Saved")) closeModal();
      break;
    }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && S.modal) { closeModal(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches("tr[data-act]")) { e.preventDefault(); e.target.click(); }
});
function onField(e) {
  const t = e.target;
  if (t.id === "q") { S.q = t.value; render(); return; }
  if (t.dataset.actChange === "req" && e.type === "change") {
    const v = t.value || null;
    patchResident(S.rid, { reqs: { [t.dataset.req]: { [t.dataset.slot]: v } } });
    return;
  }
  const m = S.modal; if (!m) return;
  const d = m.draft;
  if (t.dataset.mm) {
    const wrap = t.closest(".msel");
    d[t.dataset.mm] = wrap.querySelector('[data-part="y"]').value + "-" + wrap.querySelector('[data-part="m"]').value;
  } else if (t.dataset.m) {
    d[t.dataset.m] = t.type === "checkbox" ? t.checked : t.value;
    if (t.dataset.m === "level" && m.type !== "edit") { d.exam1 = +t.value >= 3; d.exam2 = +t.value >= 5; }
    if (t.dataset.rerender != null && e.type === "change") { renderModal(); return; }
    if (t.dataset.preview != null) {
      const rows = parseImport(d.text), good = rows.filter(r => !r.err);
      document.getElementById("imp-preview").innerHTML = importPreview(rows);
      const b = document.getElementById("imp-save"); b.disabled = !good.length; b.textContent = `Add ${good.length || ""} resident${good.length === 1 ? "" : "s"}`;
    }
  } else if (t.dataset.sc) {
    const f = t.dataset.sc;
    if (f === "holdMonths" || f === "demote") { d.committee = Object.assign({}, d.committee, { [f]: t.type === "checkbox" ? t.checked : t.value }); }
    else d[f] = t.value;
  } else if (t.dataset.ev != null) {
    d.events[+t.dataset.ev][t.dataset.f] = t.value;
    if (t.dataset.f === "tier" && e.type === "change") { renderModal(); return; }
  } else if (t.dataset.bn != null) {
    d.bonuses[+t.dataset.bn][t.dataset.f] = t.value;
  }
  if (m.type === "score") {
    const res = S.residents[m.rid];
    const temp = Object.assign({}, res, { months: Object.assign({}, res.months, { [m.ym]: d }) });
    const row = run(temp).rows.find(r => r.ym === m.ym);
    const box = document.getElementById("sc-summary"); if (box) box.innerHTML = scoreSummary(row);
  }
}
document.addEventListener("input", onField);
document.addEventListener("change", e => { if (e.target.type === "radio" || e.target.tagName === "SELECT" || e.target.type === "checkbox" || e.target.dataset.actChange) onField(e); });

/* ---------- start ---------- */
render();
(async () => {
  const db = window.claude && window.claude.use ? await window.claude.use("db").catch(() => null) : null;
  if (!db) { S.mode = "offline"; if (!S.demo) S.residents = S.live; render(); return; }
  S.db = db;
  try { const u = await window.claude.use("user"); if (u) S.canEdit = await u.canEdit(); } catch (e) {}
  db.collection("residents").onSnapshot(snap => {
    S.mode = "live";
    S.live = Object.fromEntries(snap.docs.map(d => [d.id, d.data()]));
    if (!S.demo) S.residents = S.live;
    if (S.view === "resident" && !S.residents[S.rid]) S.view = "roster";
    render();
    if (S.modal && S.modal.type === "delete" && !S.residents[S.modal.rid]) closeModal();
  }, err => { S.mode = "offline"; render(); toast("Lost the connection to the shared tracker. Reload to reconnect."); });
})();
</script>
